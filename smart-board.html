<title>السبورة الذكية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: a framed whiteboard of typed lines and fill-in layouts (long division, column sums) with a math keyboard under it, and the teacher's correction sheet beside it (stacked on phones). */
:root {
  --bg: #e9edf2;
  --surface: #ffffff;
  --surface-2: #f4f6f9;
  --fg: #172130;
  --muted: #5a6577;
  --line: #d3d9e2;
  --frame: #b9c1cc;
  --accent: #1f4fd1;
  --accent-fg: #ffffff;
  --bad: #c8321f;
  --bad-soft: #fbe9e6;
  --good: #16824a;
  --good-soft: #e3f4ea;
  --warn: #9a6200;
  --warn-soft: #fbf0d9;
  --board: #fdfdfb;
  --board-rule: #dfe6ef;
  --ink: #1d3a8a;
  --font-display: "Readex Pro", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --font-body: "IBM Plex Sans Arabic", system-ui, "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151c; --surface: #18202a; --surface-2: #1f2834; --fg: #e5eaf1; --muted: #9aa5b5;
    --line: #2b3542; --frame: #3d4858; --accent: #7196ff; --accent-fg: #0c1424;
    --bad: #ff7a66; --bad-soft: #3a1f1b; --good: #4fcf8a; --good-soft: #17322a; --warn: #f0b552; --warn-soft: #3a2e17;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151c; --surface: #18202a; --surface-2: #1f2834; --fg: #e5eaf1; --muted: #9aa5b5;
  --line: #2b3542; --frame: #3d4858; --accent: #7196ff; --accent-fg: #0c1424;
  --bad: #ff7a66; --bad-soft: #3a1f1b; --good: #4fcf8a; --good-soft: #17322a; --warn: #f0b552; --warn-soft: #3a2e17;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
.app { max-width: 1800px; margin: 0 auto; padding-block: 8px 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 8px; }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 16px; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; line-height: 1.2; margin: 0; }
.brand p { margin: 0; color: var(--muted); font-size: .78rem; }
.opts { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.opts label { color: var(--muted); font-size: .72rem; }
.field { display: flex; align-items: center; gap: 4px; }
select { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 2px 4px; font-size: .78rem; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; align-items: start; }
@media (max-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr); } .brand p { display: none; } }
.boardcol { min-width: 0; display: flex; flex-direction: column; gap: 6px; }

.tray { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px 8px; }
.tb { font: inherit; font-size: .85rem; color: var(--fg); background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 4px 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; min-height: 32px; }
.tb:hover:not(:disabled) { background: var(--surface-2); }
.tb[aria-pressed="true"] { background: var(--surface-2); border-color: var(--frame); }
.tb:disabled { opacity: .4; cursor: default; }
.tb svg { width: 18px; height: 18px; flex: none; }
.check { margin-inline-start: auto; font-family: var(--font-display); font-weight: 700; font-size: 1rem; background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 10px; padding: 6px 18px; min-height: 36px; }
.check:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.frame { background: var(--frame); border-radius: 10px; padding: 5px; box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 10px 26px -18px rgba(10,20,40,.55); }
.board { position: relative; background: var(--board); border-radius: 6px; min-height: 300px; padding: 10px 14px 18px; color: var(--ink); }
.row { display: grid; grid-template-columns: 2.4rem minmax(0, 1fr); align-items: start; border-bottom: 1.5px solid var(--board-rule); }
.row .n { font-family: var(--font-display); color: #8a94a6; text-align: center; padding-top: .55rem; font-size: 1rem; }
.row.q { border-bottom: 2px solid #c5cedb; margin-bottom: 4px; }
.row.q .n { font-size: .72rem; color: var(--ink); padding-top: .9rem; }
.lw { position: relative; min-width: 0; }
.ln, .view, .pv { display: block; width: 100%; font: 500 1.5rem/1.65 var(--font-body); color: var(--ink); padding: .15rem .4rem; min-height: 2.8rem; overflow-wrap: anywhere; }
.ln { border: 0; background: transparent; resize: none; overflow: hidden; margin: 0; }
.ln::placeholder { color: #a9b3c3; font-weight: 400; font-size: 1.15rem; }
.ln:focus { outline: none; background: rgba(31, 79, 209, .06); border-radius: 6px; }
.view, .pv { white-space: pre-wrap; cursor: text; }
.pv { display: none; }
.row.has-text:not(.editing) .pv { display: block; }
.row.has-text:not(.editing) .ln { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
/* typed math shown the way it is written on paper */
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .78em; line-height: 1.15; margin: 0 .12em; }
.fr > span { padding: 0 .2em; }
.fr .nu { border-bottom: 2px solid currentColor; }
.rt { white-space: nowrap; }
.rt .rad { border-top: 2px solid currentColor; padding: .05em .1em 0; }
.view sup, .pv sup, .sol sup { font-size: .6em; }
.ring { position: relative; border: 3px solid #d6322b; border-radius: 1.1em / .9em; padding: 0 .2em; margin: 0 .05em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.ring > sup, .cell > sup, .blk > sup { position: absolute; top: -.75em; inset-inline-end: -.6em; width: 1.35em; height: 1.35em; border-radius: 50%; background: #d6322b; color: #fff; font: 700 .55em/1.35em var(--font-display); text-align: center; z-index: 1; }
.ring.hl, .ann.hl, .cell.hl, .blk.hl { box-shadow: 0 0 0 3px rgba(214, 50, 43, .25); }
.ann { color: #c62828; font: 500 1.05rem/1.5 var(--font-body); padding: .1rem .4rem .45rem; border-radius: 6px; }
.ann .why { font-size: .9em; color: #a63a2f; }
.notes-stale .ann, .notes-stale .sol { opacity: .35; }
.sol { margin-top: 14px; border-top: 3px dashed #0b6b3a; padding-top: 6px; color: #0b6b3a; font: 500 1.15rem/1.6 var(--font-body); }
.sol h4 { margin: 0 0 2px; font: 700 1.2rem var(--font-display); }
.sol .sum { margin: 0 0 4px; font-size: .95em; }
.sol ol { margin: 0; padding-inline-start: 1.5em; }
.ar-digits .sol ol, .ar-digits .steps { list-style-type: arabic-indic; }
.sol .fa { display: inline-block; border: 3px solid currentColor; border-radius: .4em; padding: 0 .6em; margin-top: 6px; font-weight: 700; }
.tag { display: inline-block; background: var(--warn-soft); color: var(--warn); border-radius: 999px; padding: 2px 12px; font: 600 .78rem var(--font-body); margin-bottom: 4px; }
.addline { font: 500 .9rem var(--font-body); color: #7b879b; background: transparent; border: 1px dashed #c5cedb; border-radius: 8px; padding: 4px 12px; margin-top: 8px; cursor: pointer; }

/* fill-in layouts: long division and column operations */
.blk { position: relative; display: inline-flex; flex-direction: column; gap: 4px; margin: 6px .4rem 8px; padding: 6px 8px 8px; border-radius: 8px; --cw: 2.1rem; }
.blk-t { font: 600 .78rem var(--font-body); color: #7b879b; direction: rtl; }
.blk .g { display: grid; gap: 3px 2px; direction: ltr; align-items: center; }
.cell { position: relative; width: var(--cw); height: 2.4rem; text-align: center; font: 500 1.45rem/2.4rem var(--font-body); color: var(--ink); border: 1px dashed #c9d2e0; border-radius: 5px; background: transparent; padding: 0; caret-color: var(--accent); }
input.cell:focus { outline: none; border: 2px solid var(--accent); background: rgba(31, 79, 209, .07); }
span.cell { border-color: transparent; }
.cell.sm { height: 1.6rem; font-size: .95rem; line-height: 1.6rem; color: #6a7590; }
.cell.top { border: 0; border-top: 3px solid var(--ink); border-radius: 0; }
.cell.sub { border-bottom: 3px solid var(--ink); border-radius: 5px 5px 0 0; }
.cell.bad { background: #fff1ef; box-shadow: inset 0 0 0 2.5px #d6322b; border-radius: 6px; }
.dv { font: 500 1.45rem var(--font-body); color: var(--ink); text-align: center; padding: 0 .3rem; white-space: nowrap; }
.dv.br { border-right: 3px solid var(--ink); border-top: 3px solid transparent; border-top-right-radius: 1rem; }
.dv.sub { border-bottom: 3px solid var(--ink); }
.rl { font: 500 .72rem var(--font-body); color: #8a94a6; padding-inline-start: .4rem; direction: rtl; white-space: nowrap; }
.blk.bad-all { box-shadow: inset 0 0 0 3px #d6322b; }
.blk-ctl { display: flex; flex-wrap: wrap; gap: 6px; direction: rtl; }
.mini { font: 500 .8rem var(--font-body); color: var(--fg); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 10px; cursor: pointer; }
.mini.go { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.setup { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; direction: rtl; font: 500 1rem var(--font-body); color: var(--ink); }
.sf { width: 6.5rem; font: 500 1.3rem var(--font-body); color: var(--ink); text-align: center; border: 1px dashed #c9d2e0; border-radius: 6px; background: transparent; padding: 2px 4px; }
.sf:focus { outline: none; border: 2px solid var(--accent); }

/* keyboard */
.kb { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px; display: flex; flex-direction: column; gap: 5px; user-select: none; -webkit-user-select: none; }
.keys { display: grid; grid-template-columns: repeat(var(--cols, 8), minmax(0, 1fr)); gap: 5px; direction: ltr; }
.keys.rtl { direction: rtl; }
.key { font: 500 1.2rem/1.1 var(--font-body); min-height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); cursor: pointer; touch-action: manipulation; padding: 2px; }
.key small { display: block; font-size: .62rem; color: var(--muted); font-weight: 400; margin-top: 1px; }
.key:hover { border-color: var(--frame); }
.key:active, .key.down { background: var(--line); }
.key.op { color: var(--accent); font-weight: 600; }
.key.fn { font-size: .85rem; color: var(--muted); }
.key.lay { font-size: .9rem; font-weight: 600; color: var(--accent); }
.key.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.key.on small { color: inherit; }
.key.s2 { grid-column: span 2; }
.key.enter { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-size: .95rem; }

.panel { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.panel h2 { font-family: var(--font-display); font-size: 1.15rem; margin: 0; }
.panel h3 { font-family: var(--font-display); font-size: .95rem; margin: 0 0 6px; }
.panel p { margin: 0; }
.muted { color: var(--muted); }
.howto { margin: 0; padding-inline-start: 1.3em; display: flex; flex-direction: column; gap: 6px; }
.chiprow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { display: inline-block; border-radius: 999px; padding: 2px 12px; font-size: .82rem; font-weight: 600; }
.chip.ok { background: var(--good-soft); color: var(--good); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.plain { background: var(--surface-2); color: var(--muted); }
.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.item { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; border-radius: 10px; padding: 10px; border: 1px solid var(--line); cursor: pointer; overflow-wrap: anywhere; color: var(--bad); }
.item.hl { border-color: currentColor; }
.item > div { color: var(--fg); }
.num { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: #d6322b; font-family: var(--font-display); font-weight: 700; font-size: .9rem; }
.item b { font-weight: 600; }
.item .fix { color: var(--good); font-weight: 600; }
.steps { margin: 0; padding-inline-start: 1.4em; display: flex; flex-direction: column; gap: 4px; overflow-wrap: anywhere; }
.final { background: var(--good-soft); color: var(--fg); border-radius: 10px; padding: 10px 12px; overflow-wrap: anywhere; }
.final small { display: block; color: var(--good); font-weight: 600; font-size: .8rem; }
.final div { font-size: 1.1rem; font-weight: 600; }
.notice { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 8px 12px; font-size: .9rem; }
.errbox { background: var(--bad-soft); color: var(--bad); border-radius: 10px; padding: 10px 12px; }
.working { display: flex; align-items: center; gap: 12px; }
.spin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .9s linear infinite; flex: none; }
.spin.mini { width: 12px; height: 12px; border-width: 2px; display: inline-block; vertical-align: -1px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
.ghost { font: inherit; font-size: .9rem; color: var(--fg); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 14px; cursor: pointer; align-self: flex-start; }
.tnum { font-variant-numeric: tabular-nums; }
bdi.m { direction: ltr; unicode-bidi: isolate; white-space: nowrap; }
.toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: 10px; font-size: .9rem; max-width: calc(100% - 32px); z-index: 20; }
@media (max-width: 560px) {
  .brand h1 { font-size: 1rem; }
  .opts label { display: none; }
  .tb .lbl { display: none; }
  .ln, .view, .pv { font-size: 1.3rem; min-height: 2.5rem; }
  .row { grid-template-columns: 1.8rem minmax(0, 1fr); }
  .board { min-height: 220px; padding: 8px 8px 14px; }
  .blk { --cw: 1.85rem; margin-inline: 0; padding-inline: 2px; }
  .cell, .dv { font-size: 1.25rem; }
  .key { min-height: 42px; font-size: 1.1rem; }
  .kb { padding: 4px; gap: 4px; } .keys { gap: 4px; }
}
</style>

<div class="app" dir="rtl" lang="ar">
  <header class="top">
    <div class="brand">
      <h1>السبورة الذكية</h1>
      <p>اكتب السؤال وحلّك بلوحة المفاتيح سطرًا سطرًا، ثم اضغط «تصحيح».</p>
    </div>
    <div class="opts">
      <div class="field">
        <label for="stage">المرحلة</label>
        <select id="stage">
          <option value="">أي مرحلة</option>
          <option value="المرحلة الابتدائية">ابتدائي</option>
          <option value="المرحلة المتوسطة">متوسط</option>
          <option value="المرحلة الثانوية">ثانوي</option>
          <option value="المرحلة الجامعية">جامعي</option>
        </select>
      </div>
      <div class="field">
        <label for="digits">الأرقام</label>
        <select id="digits">
          <option value="ar">أرقام عربية ١٢٣</option>
          <option value="en">أرقام إنجليزية 123</option>
        </select>
      </div>
      <div class="field">
        <label for="lang">لغة الشرح</label>
        <select id="lang">
          <option value="auto">الشرح بلغة السؤال</option>
          <option value="ar">الشرح بالعربية</option>
          <option value="en">Explain in English</option>
        </select>
      </div>
      <div class="field">
        <label for="depth">التصحيح</label>
        <select id="depth">
          <option value="complex">تصحيح دقيق (موصى به)</option>
          <option value="default">تصحيح سريع</option>
        </select>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="boardcol">
      <div class="tray" role="toolbar" aria-label="أدوات السبورة">
        <button class="tb" id="clearBtn" title="مسح السبورة">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg><span class="lbl">مسح</span>
        </button>
        <button class="tb" id="undoBtn" title="تراجع">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7l5 5-5 5"/><path d="M20 12H9a5 5 0 0 0 0 10h2"/></svg><span class="lbl">تراجع</span>
        </button>
        <button class="tb" id="sysKbBtn" aria-pressed="false" title="استخدام لوحة مفاتيح الجهاز بدل لوحة الرياضيات">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg><span class="lbl">لوحة الجهاز</span>
        </button>
        <button class="tb" id="notesBtn" aria-pressed="true" title="كتابة التصحيح والحل على السبورة">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19c3-1 4-6 7-6s2 5 5 5 3-3 4-4"/><path d="M4 7h10M4 11h6"/></svg><span class="lbl">الحل</span>
        </button>
        <button class="tb check" id="checkBtn">✓ تصحيح</button>
      </div>

      <div class="frame"><div class="board" id="board" lang="ar"></div></div>

      <div class="kb" id="kb" aria-label="لوحة المفاتيح">
        <div class="keys" id="keys"></div>
        <div class="keys" id="kbBar" style="--cols:8"></div>
      </div>
    </section>

    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const boardEl = $('#board'), panel = $('#panel'), keysEl = $('#keys'), barEl = $('#kbBar');
  const STORE = 'smartboard.kb1';
  const DIG = { ar: '٠١٢٣٤٥٦٧٨٩', en: '0123456789' };

  // lines[0] is the question; each later line is typed text or a fill-in layout object
  let lines = ['', ''];
  let focusIdx = 0, curEl = null;
  let digits = 'ar', tab = 'math', shift = false, sysKb = false, showNotes = true;
  let result = null, stale = false, isExample = false;
  let sampleP = null, ctl = null;

  // ---------- helpers ----------
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // keep runs of Latin math in left-to-right order inside Arabic text
  const MATH = /[A-Za-z0-9(\[√π∞|−\-+][A-Za-z0-9\s=+\-−×÷*/^().,،²³√π∞≤≥≠<>|°%\[\]→]*[A-Za-z0-9)\]²³π∞°%|]/g;
  const fmt = (s) => {
    s = String(s ?? ''); let out = '', last = 0;
    for (const m of s.matchAll(MATH)) {
      out += esc(s.slice(last, m.index)) + (/[A-Za-z=+×÷^<>≤≥≠−√]/.test(m[0]) ? `<bdi class="m" dir="ltr">${esc(m[0])}</bdi>` : esc(m[0]));
      last = m.index + m[0].length;
    }
    return out + esc(s.slice(last));
  };
  const num = (n) => String(n).replace(/\d/g, (d) => DIG[digits][d]);
  const isBlock = (x) => !!x && typeof x === 'object';
  const isBlank = (x) => isBlock(x) ? !blockHasContent(x) : !String(x).trim();
  let toastT;
  function toast(msg, action) {
    const t = $('#toast');
    t.textContent = msg;
    if (action) {
      const b = document.createElement('button'); b.className = 'ghost'; b.textContent = action.label;
      b.style.cssText = 'margin-inline-start:8px;padding:2px 10px';
      b.onclick = () => { action.run(); t.hidden = true; };
      t.appendChild(b);
    }
    t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, action ? 6000 : 2800);
  }
  function save() {
    if (isExample) return;
    try { localStorage.setItem(STORE, JSON.stringify(lines)); } catch (_) {}

  const viewing = () => !!(result && !stale);

  // Typed math shown as on paper: a/b and (..)/(..) stacked, ^ raised, √ and ∛ with a bar.
  function pretty(s) {
    s = String(s); let i = 0;
    const atomCh = /[0-9٠-٩A-Za-zء-ي٫.π∞]/;

      let d = 0, j = i;
      for (; j < s.length; j++) { if (s[j] === open) d++; else if (s[j] === close && --d === 0) break; }
      if (j >= s.length) return null;

      if (s[i] === '(') { const inner = group('(', ')'); return inner == null ? null : { html: pretty(inner), paren: true }; }

  // ---------- fill-in layouts ----------

  function blockHasContent(b) {

  function blockHTML(b, i, view, errs) {

    };

  // ---------- board ----------
  function lineErrors(i) {

  }
  function showInfo(msg) {
    const old = panel.querySelector('.notice.info'); if (old) old.remove();
    const n = document.createElement('div'); n.className = 'notice info'; n.textContent = msg;
    panel.prepend(n); toast(msg);
  }
  function renderPanel() {
    if (!result) { renderIdle(); return; }
    const d = result.data, en = d.lang === 'en', T = en ? EN : AR, live = result.live;
    panel.dir = en ? 'ltr' : 'rtl'; panel.lang = en ? 'en' : 'ar';
    const label = T.verdict[d.verdict] || T.result;
    let h = `<div class="chiprow">${isExample ? `<span class="chip warn">${T.example}</span>` : ''}${live ? `<span class="chip plain"><span class="spin mini"></span> ${T.writing}</span>` : ''}${d.verdict || !live ? `<span class="chip ${VERDICT_CLS[d.verdict] || 'plain'}">${label}</span>` : ''}${d.subject ? `<span class="chip plain">${esc(d.subject)}</span>` : ''}</div>`;
    if (stale) h += `<div class="notice">${T.stale}</div>`;
    if (d.summary) h += `<p>${fmt(d.summary)}</p>`;
    if (d.errors.length) {
      h += `<div><h3>${T.errors}</h3><ul class="items">` + d.errors.map((e, i) => {
        const n = parseInt(e.line, 10) || 0;
        const onBlock = isBlock(lines[Math.min(n, lines.length - 1)]);
        const where = n ? T.line + ' ' + num(n) + (onBlock ? ' · ' + blockName(lines[n]) : '') : T.question;
        const part = e.part ? `<br>${onBlock ? T.at : T.wrote} <b>${onBlock && !en ? esc(partLabel(e.part)) : fmt(e.part)}</b>` : '';
        return `<li class="item" data-key="e${i}"><span class="num">${num(i + 1)}</span><div><span class="muted">${where}</span>${part}<br>${fmt(e.why)}${e.fix ? `<br><span class="fix">${T.fix} ${fmt(e.fix)}</span>` : ''}</div></li>`;
      }).join('') + `</ul></div>`;
    } else if (!live && d.verdict === 'correct') h += `<p class="muted">${T.noErrors}</p>`;
    if (d.steps.length) h += `<div><h3>${T.solution}</h3><ol class="steps">${d.steps.map((s) => `<li>${fmt(s)}</li>`).join('')}</ol></div>`;
    if (d.final_answer) h += `<div class="final"><small>${T.final}</small><div>${fmt(d.final_answer)}</div></div>`;
    if (result.truncated || result.interrupted) h += `<div class="notice">${T.incomplete}</div>`;
    if (live) h += `<button class="ghost" id="stopBtn">${T.stop}</button>`;
    if (isExample) h += `<p class="muted">هذا مثال يوضح شكل التصحيح. اضغط على السبورة لتكتب سؤالك أنت.</p>`;
    panel.innerHTML = h;
    const sb = $('#stopBtn'); if (sb) sb.onclick = () => ctl && ctl.abort();
    panel.querySelectorAll('.item').forEach((it) => {
      it.addEventListener('mouseenter', () => highlight(it.dataset.key));
      it.addEventListener('mouseleave', () => highlight(''));
      it.addEventListener('click', () => {
        highlight(it.dataset.key);
        const r = boardEl.querySelector(`[data-key="${it.dataset.key}"]`); if (r) r.scrollIntoView({ block: 'center', behavior: 'smooth' });
      });
    });
  }

  // ---------- example ----------
  function loadExample() {
    isExample = true;
    const ld = makeLdiv(); ld.dividend = '١٥٦'; ld.divisor = '١٢'; startLdiv(ld);
    [['', '١', '٢'], ['١', '٢', ''], ['', '٣', '٦'], ['', '٣', '٦'], ['', '', '٠']].forEach((cells, r) => { ld.rows[r].cells = cells; });
    lines = ['اقسم: ١٥٦ ÷ ١٢', ld, '١٥٦ ÷ ١٢ = ١٢'];
    result = { data: {
      lang: 'ar', subject: 'رياضيات', verdict: 'incorrect',
      summary: 'خطوات القسمة صحيحة، لكنك كتبت الرقم الثاني من خارج القسمة خطأ.',
      errors: [
        { line: 1, part: 'quotient c3', why: '٣٦ ÷ ١٢ = ٣، فالرقم الثاني في خارج القسمة ٣ وليس ٢.', fix: 'خارج القسمة ١٣' },
        { line: 2, part: '١٢', why: 'الإجابة النهائية مبنية على الخطأ في خارج القسمة.', fix: '١٥٦ ÷ ١٢ = ١٣' },
      ],
      steps: ['١٥ ÷ ١٢ = ١ والباقي ٣', 'ننزل ٦ فيصبح العدد ٣٦', '٣٦ ÷ ١٢ = ٣ والباقي ٠', 'خارج القسمة ١٣', 'التحقق: ١٣ × ١٢ = ١٥٦ ✓'],
      final_answer: '١٣',
    } };
    stale = false;
    render(); renderPanel();
  }
  function wipeExample() {
    isExample = false; lines = ['', '']; result = null; stale = false;
    render(0); renderPanel();
  }

  // ---------- start ----------
  try { const d = localStorage.getItem(STORE + '.digits'); if (d === 'ar' || d === 'en') digits = d; } catch (_) {}
  try { showNotes = localStorage.getItem(STORE + '.notes') !== 'off'; } catch (_) {}
  $('#digits').value = digits;
  document.querySelector('.app').classList.toggle('ar-digits', digits === 'ar');
  $('#notesBtn').setAttribute('aria-pressed', showNotes);
  for (const id of ['stage', 'lang', 'depth']) {   // remember the student's choices on this device
    const el = $('#' + id);
    try { const v = localStorage.getItem(STORE + '.' + id); if (v != null && [...el.options].some((o) => o.value === v)) el.value = v; } catch (_) {}
    el.addEventListener('change', () => { try { localStorage.setItem(STORE + '.' + id, el.value); } catch (_) {} });
  }
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (_) {}
  getSample();
  renderKeys();
  if (Array.isArray(saved) && saved.some((l) => !isBlank(l))) {
    lines = saved.map((l) => isBlock(l) ? l : String(l)); if (lines.length < 2) lines.push('');
    render(); renderPanel();
  } else loadExample();
})();
</script>
