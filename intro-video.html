<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الفيديو التعريفي</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<!--
  ملف الفيديو التعريفي لمحاكي ورشة التحكم في المحركات — نسخة مستقلة للتعديل والتجربة.
  افتحه في المتصفح مباشرة (لا يحتاج خادمًا ولا إنترنت إلا للخط).

  للتعديل: ابحث عن «المشاهد» داخل هذا الملف. لكل مشهد:
    t     عنوان المشهد (يظهر أعلى الصورة وفي شريط التقدم)
    say   نص التعليق: يُنطق بصوت الجهاز ويُكتب أسفل المشهد
    cap   (اختياري) نص مكتوب مختلف عن المنطوق — مثلًا بلا تشكيل
    min   أقل مدة للمشهد بالثواني
    audio (اختياري) مسار تسجيل صوتي يُشغَّل بدل نطق الجهاز، مثل 'audio/1.mp3'
    svg   رسم المشهد؛ الكلمات المكتوبة داخل الرسم هي النصوص العربية بين علامتي ' '
  لتجربة تسجيلاتك دون تعديل الكود: زر «🎙 تجربة تسجيلاتي» واختر ملفات مسمّاة 1.mp3 و2.mp3 ... بعدد المشاهد.
-->
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{margin:0;min-height:100vh;background:#05080f;color:#eef3f9;font-family:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;font-size:15px;line-height:1.5;display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px}
button,select,input{font:inherit;color:inherit}
.vtools{width:min(880px,100%);display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#0f1726;border:1px solid #1f2c40;border-radius:12px;padding:10px 12px;font-size:.88rem}
.vtools label,.vtools button{background:#1b2638;border:1px solid #2c3b52;border-radius:8px;padding:6px 12px;cursor:pointer}
.vtools input[type=file]{display:none}
.vtools p{margin:0;flex-basis:100%;color:#b9c7d8}
.vtools b{color:#4cd07d}
#vidModal{background:rgba(0,0,0,.78);z-index:80}
#vidModal .vbox{background:#0b1220;color:#eef3f9;border-radius:14px;overflow:hidden;width:min(880px,100%,calc((100vh - 210px)*1.778));min-width:min(300px,100%);box-shadow:0 18px 50px rgba(0,0,0,.5)}
.vhead{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#0f1726}
.vhead h2{margin:0;font-size:1rem;flex:1}
#vVoice{max-width:42%;height:36px;background:#1b2638;border:1px solid #2c3b52;color:#fff;border-radius:8px;padding:0 6px;font-size:.85rem}
#vVoice[hidden]{display:none}
.vstage{position:relative;aspect-ratio:16/9;background:radial-gradient(circle at 50% 35%,#1d3557 0%,#0b1220 75%);overflow:hidden}
.vstage svg{position:absolute;inset:0;width:100%;height:100%;direction:ltr}
.vstage text{font-family:inherit}
.vtag{position:absolute;top:3%;inset-inline-start:3%;background:#1f5fbf;color:#fff;padding:.15em .75em;border-radius:20px;font-size:clamp(.7rem,1.8vw,.92rem);font-weight:700}
.vend{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(11,18,32,.6)}
.vend[hidden]{display:none}
.vend button{font-size:1.05rem;font-weight:700;padding:10px 22px;border-radius:30px;border:0;background:#e53935;color:#fff;cursor:pointer}
.vcap{margin:0;padding:8px 14px;min-height:4.4em;text-align:center;font-size:clamp(.85rem,2.2vw,1.08rem);line-height:1.65;background:#0f1726;border-top:1px solid #1f2c40}
.vctl{display:flex;gap:6px;align-items:center;padding:8px 10px;background:#0f1726}
.vctl>button,.vhead button{background:#1b2638;border:1px solid #2c3b52;color:#fff;border-radius:8px;height:36px;min-width:40px;cursor:pointer;font-size:1rem;flex:none}
.vctl>button:focus-visible,.vhead button:focus-visible,.vseg:focus-visible{outline:3px solid #6ea4ff;outline-offset:2px}
.vprog{flex:1;display:flex;gap:3px;min-width:60px}
.vseg{flex:1;height:22px;display:flex;align-items:center;cursor:pointer;background:none;border:0;padding:0}
.vseg b{display:block;width:100%;height:6px;background:#2c3b52;border-radius:3px;overflow:hidden}
.vseg i{display:block;height:100%;width:0;background:#4ea1ff}
.vnote{margin:0;padding:0 12px 8px;background:#0f1726;color:#ffd27a;font-size:.8rem}
.vnote:empty{display:none}
.vstage .v-pop{opacity:0;animation:vPop .55s cubic-bezier(.3,1.5,.6,1) forwards;transform-box:fill-box;transform-origin:center}
.vstage .v-fade{opacity:0;animation:vFade .6s ease-out forwards}
.vstage .v-spin{animation:vSpin .7s linear infinite;transform-box:fill-box;transform-origin:center}
.vstage .v-slow{animation:vSpin 4s linear infinite;transform-box:fill-box;transform-origin:center}
.vstage .v-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:vDraw 1.05s ease-in-out forwards}
.vstage .v-flow{stroke-dasharray:7 9;animation:vFlow .5s linear infinite}
.vstage .v-press{animation:vPress .5s ease-in-out both;transform-box:fill-box;transform-origin:center}
.vstage .v-pull{animation:vPull .25s ease-in forwards}
.vstage .v-turn{animation:vTurn .45s ease-in-out forwards;transform-box:fill-box;transform-origin:center}
.vstage .v-ping{opacity:0;animation:vPing .8s ease-out forwards;transform-box:fill-box;transform-origin:center}
.vstage .v-blink{animation:vBlink 1s steps(2) infinite}
.vstage .v-piston{animation:vPiston 1.4s ease-in-out infinite alternate}
.vstage .v-cur{opacity:0;animation:vCur 3.2s ease-in-out .5s forwards}
.vstage .v-fly{opacity:0;animation:vFly 1.4s ease-in-out forwards}
.vstage .v-pulse{animation:vPulse 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes vPop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
@keyframes vFade{to{opacity:1}}
@keyframes vSpin{to{transform:rotate(360deg)}}
@keyframes vDraw{to{stroke-dashoffset:0}}
@keyframes vFlow{to{stroke-dashoffset:-16}}
@keyframes vPress{0%,100%{transform:none}50%{transform:scale(.72)}}
@keyframes vPull{to{transform:translateY(13px)}}
@keyframes vTurn{to{transform:rotate(90deg)}}
@keyframes vPing{0%{opacity:.9;transform:scale(.2)}100%{opacity:0;transform:scale(1)}}
@keyframes vBlink{50%{opacity:.15}}
@keyframes vPiston{to{transform:translateX(52px)}}
@keyframes vCur{0%{opacity:0;transform:translate(560px,300px)}8%{opacity:1}30%,44%{transform:translate(195px,197px)}74%,100%{opacity:1;transform:translate(440px,112px)}}
@keyframes vFly{0%{opacity:0;transform:translate(300px,175px) scale(.7)}15%{opacity:1}55%{transform:translate(210px,90px) scale(.9)}90%{opacity:1}100%{opacity:0;transform:translate(115px,140px) scale(.6)}}
@keyframes vPulse{0%{opacity:.6;transform:scale(.9)}100%{opacity:0;transform:scale(1.5)}}
#vidModal.vpaused .vstage *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){.vstage .v-spin,.vstage .v-slow,.vstage .v-flow,.vstage .v-blink,.vstage .v-piston,.vstage .v-pulse{animation:none}}
#vidModal{width:100%;display:flex;justify-content:center;background:none}
</style>
</head>
<body>
<div id="vidModal">
  <div class="vbox">
    <div class="vhead"><h2 id="vT">🎬 تعرّف على المحاكي</h2><select id="vVoice" title="اختيار صوت التعليق" aria-label="صوت التعليق" hidden></select></div>
    <div class="vstage"><div id="vArt" aria-hidden="true"></div><span class="vtag" id="vTag"></span><div class="vend" id="vEnd" hidden><button id="vAgain">↻ مشاهدة مرة أخرى</button></div></div>
    <p class="vcap" id="vCap"></p>
    <div class="vctl">
      <button id="vPlay" title="تشغيل" aria-label="تشغيل">▶</button>
      <button id="vPrev" title="المشهد السابق" aria-label="المشهد السابق">›</button>
      <button id="vNext" title="المشهد التالي" aria-label="المشهد التالي">‹</button>
      <div class="vprog" id="vProg"></div>
      <button id="vMute" title="كتم الصوت" aria-label="كتم الصوت">🔊</button>
    </div>
    <p class="vnote" id="vNote"></p>
  </div>
</div>
<div class="vtools">
  <label>🎙 تجربة تسجيلاتي<input type="file" id="vAud" accept="audio/*" multiple></label>
  <button id="vAudClr" hidden>✕ الرجوع لصوت الجهاز</button>
  <span id="vAudInfo"></span>
  <p>سمِّ كل تسجيل برقم مشهده (<bdi dir="ltr">1.mp3</bdi> للمشهد الأول، <bdi dir="ltr">2.mp3</bdi> للثاني …). المشهد الذي ليس له تسجيل يُنطق بصوت الجهاز.</p>
</div>
<script>
(()=>{
const g=id=>document.getElementById(id);
const vM=g('vidModal'),art=g('vArt'),cap=g('vCap'),tag=g('vTag'),prog=g('vProg'),endV=g('vEnd'),note=g('vNote'),bPlay=g('vPlay'),bMute=g('vMute');
const D=d=>`style="animation-delay:${d}s"`;
const T=(x,y,s,t,o='')=>`<text x="${x}" y="${y}" font-size="${s}" text-anchor="middle" direction="rtl" fill="#eef3f9" ${o}>${t}</text>`;
const SV=b=>`<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">${b}</svg>`;
/* قطع اللوحة */
const motor=(x,y,r,spin)=>`<g transform="translate(${x} ${y})"><rect x="${-r*.35}" y="${-r-12}" width="${r*.7}" height="14" rx="3" fill="#24496f"/><rect x="${-r-8}" y="${r-6}" width="${2*r+16}" height="12" rx="4" fill="#3b4a5e"/><circle r="${r}" fill="#2f6fb0" stroke="#9cc6ff" stroke-width="3"/><circle r="${r*.8}" fill="#173a63"/><g ${spin!=null?`class="v-spin" ${D(spin)}`:''}><circle r="${r*.75}" fill="none"/>${[0,72,144,216,288].map(a=>`<ellipse cx="${r*.4}" rx="${r*.36}" ry="${r*.13}" fill="#8fb8e6" transform="rotate(${a})"/>`).join('')}</g><circle r="${r*.15}" fill="#dfe8f3"/></g>`;
const contactor=(x,y,pull)=>`<g transform="translate(${x} ${y})"><rect x="-34" y="-50" width="68" height="100" rx="6" fill="#d9dcd6" stroke="#9aa09a"/>${[-20,0,20].map(d=>`<circle cx="${d}" cy="-40" r="5" fill="#c9b072" stroke="#6b5f3c"/><circle cx="${d}" cy="40" r="5" fill="#c9b072" stroke="#6b5f3c"/>`).join('')}<rect x="-22" y="-24" width="44" height="44" rx="3" fill="#7f878d"/><rect ${pull!=null?`class="v-pull" ${D(pull)}`:''} x="-15" y="-18" width="30" height="14" rx="2" fill="#2b3036"/><text y="15" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">K1</text></g>`;
const btn=(x,y,col,press)=>`<g transform="translate(${x} ${y})"><rect x="-26" y="-26" width="52" height="52" rx="8" fill="#e9ebee" stroke="#9aa3ad"/><circle r="17" fill="#4a5058"/><circle r="14" fill="${col}" ${press!=null?`class="v-press" ${D(press)}`:''}/></g>`;
const lamp=(x,y,col,on,r=16)=>`<g transform="translate(${x} ${y})"><circle r="${r+3}" fill="#3a4350" stroke="#9aa3ad" stroke-width="2"/><circle r="${r}" fill="#59636f"/>${on!=null?`<g class="v-fade" ${D(on)}><circle r="${r*1.9}" fill="${col}" opacity=".3"/><circle r="${r}" fill="${col}"/><circle cx="${-r*.3}" cy="${-r*.3}" r="${r*.3}" fill="#fff" opacity=".6"/></g>`:''}</g>`;
const breaker=x=>`<rect x="${x-18}" y="105" width="36" height="90" rx="4" fill="#f1f1ee" stroke="#9aa09a"/><rect x="${x-7}" y="118" width="14" height="26" rx="3" fill="#2b3036"/><rect x="${x-5}" y="120" width="10" height="11" rx="2" fill="#e53935"/>`;
const overload=x=>`<rect x="${x-30}" y="110" width="60" height="80" rx="5" fill="#eeeeea" stroke="#9aa09a"/><circle cx="${x-6}" cy="150" r="13" fill="#d8322b"/><circle cx="${x+16}" cy="134" r="6" fill="#2d6fd6"/><circle cx="${x+16}" cy="166" r="6" fill="#d8322b"/>`;
const timer=(x,s)=>`<rect x="${x-28}" y="105" width="56" height="90" rx="5" fill="#f1f0ea" stroke="#9aa09a"/><circle cx="${x}" cy="150" r="18" fill="#fff" stroke="#999" stroke-width="2"/><g class="v-slow" ${D(s)}><circle cx="${x}" cy="150" r="14" fill="none"/><line x1="${x}" y1="150" x2="${x}" y2="137" stroke="#d8322b" stroke-width="3" stroke-linecap="round"/></g>`;
const qr=(x,y)=>{let s=`<rect x="${x}" y="${y}" width="100" height="100" rx="6" fill="#fff"/>`;const f=(a,b)=>`<rect x="${a+4}" y="${b+4}" width="26" height="26" fill="#111"/><rect x="${a+8}" y="${b+8}" width="18" height="18" fill="#fff"/><rect x="${a+12}" y="${b+12}" width="10" height="10" fill="#111"/>`;
  let r=7;for(let i=0;i<8;i++)for(let j=0;j<8;j++){r=(r*37+11)%101;if(r%3&&!((i<3&&j<3)||(i<3&&j>4)||(i>4&&j<3)))s+=`<rect x="${x+8+j*11}" y="${y+8+i*11}" width="10" height="10" fill="#111"/>`;}
  return s+f(x,y)+f(x+66,y)+f(x,y+66);};
/* المشاهد: عنوان، نص التعليق، أقل مدة بالثواني، الرسم */
/* ======== المشاهد: عدّل النصوص هنا ======== */
const SC=[
{t:'مرحبًا',min:7,say:'مَرْحَبَاً بِكْ فِي مُحَاكِي وَرْشَةْ التَّحَكُّمْ فِي المُحَرِّكَاتِ الكَهْرَبَائِيَّة: وَرْشَةٌ افْتِرَاضِيَّة تَتَدَرَّبُ فِيهَا عَلَى تَوْصِيلْ دَوَائِرْ التَّحَكُّمْ، وَكَأَنَّكَ أَمَامْ لَوْحَةٍ حَقِيقِيَّة.',
 svg:SV(`<circle cx="320" cy="135" r="80" fill="none" stroke="#4ea1ff" stroke-width="3" class="v-pulse"/>${motor(320,135,66,0)}
 <path class="v-fade" ${D(.5)} d="M190 95l-22 40h18l-12 34 32-46h-19l14-28z" fill="#ffd54a"/><path class="v-fade" ${D(.8)} d="M452 95l-22 40h18l-12 34 32-46h-19l14-28z" fill="#ffd54a"/>
 <g class="v-fade" ${D(.6)}>${T(320,262,26,'محاكي ورشة التحكم في المحركات','font-weight="700"')}</g><g class="v-fade" ${D(1.4)}>${T(320,300,17,'تدرّب على دوائر التحكم الكهربائي بأمان','fill-opacity=".75"')}</g>`)},
{t:'ماذا يحتوي؟',min:9,say:'يَضُمُّ المُحَاكِي قِطَعْ اللَّوْحَة المَعْرُوفَة: القَاطِعْ، وَالكُونْتَاكْتُورْ، وَالأُوفَرْلُودْ، وَالمُؤَقِّتْ، وَالضَّوَاغِطْ، وَلَمْبَاتْ البَيَانْ، وَالمُحَرِّكَاتْ.',
 svg:SV(`<rect x="22" y="143" width="596" height="14" rx="3" fill="#59636f" class="v-fade"/>
 ${[[60,'قاطع',breaker(60)],[148,'كونتاكتور',contactor(148,150)],[236,'أوفرلود',overload(236)],[322,'مؤقت',timer(322,4.6)],[408,'ضواغط',`<rect x="382" y="105" width="52" height="90" rx="6" fill="#e9ebee" stroke="#9aa3ad"/><circle cx="408" cy="130" r="13" fill="#1a8a42"/><circle cx="408" cy="170" r="13" fill="#d8322b"/>`],[492,'لمبات',`<rect x="466" y="105" width="52" height="90" rx="6" fill="#2b2f33"/>${lamp(492,128,'#4cd07d',6.2,11)}${lamp(492,172,'#ff6b60',6.4,11)}`],[578,'محرك',motor(578,150,36,7.4)]]
 .map(([x,l,s],k)=>{const d=[2.2,3,3.8,4.6,5.4,6,7][k];return `<g class="v-pop" ${D(d)}>${s}</g><g class="v-fade" ${D(d+.2)}>${T(x,232,15,l)}</g>`;}).join('')}
 <g class="v-fade" ${D(.3)}>${T(320,60,20,'لوحة تحكم كاملة بين يديك','font-weight="700"')}</g>`)},
{t:'طريقةُ الاستخدام',min:8,say:'طَرِيقَةُ الاسْتِخْدَامْ سَهْلَة: اضْغَطْ عَلَى طَرَفْ، ثُمّْ اضْغَطْ عَلَى الطَّرَفْ الآخَرْ، فَيَمْتَدّْ السِّلْكْ بَيْنَهُمَا. وَيُمْكِنُكَ إِضَافَةُ القِطَعْ وَتَحْرِيكُهَا مِنْ شَرِيطْ الأَدَوَاتْ.',
 svg:SV(`<rect x="140" y="95" width="80" height="110" rx="8" fill="#e9ebee" stroke="#9aa3ad"/><circle cx="180" cy="135" r="20" fill="#1a8a42" stroke="#4a5058" stroke-width="4"/>
 <circle cx="165" cy="197" r="7" fill="#c9b072" stroke="#6b5f3c"/><circle cx="195" cy="197" r="7" fill="#c9b072" stroke="#6b5f3c"/>
 <text x="165" y="222" font-size="11" text-anchor="middle" fill="#cfe0f5">13</text><text x="195" y="222" font-size="11" text-anchor="middle" fill="#cfe0f5">14</text>
 ${contactor(460,152)}<text x="440" y="93" font-size="11" text-anchor="middle" fill="#cfe0f5">A1</text>
 <path class="v-draw" ${D(1.9)} pathLength="1" d="M195 197C260 300 380 20 440 112" fill="none" stroke="#e53935" stroke-width="5" stroke-linecap="round"/>
 <circle cx="195" cy="197" r="22" fill="none" stroke="#ffd54a" stroke-width="3" class="v-ping" ${D(1.45)}/><circle cx="440" cy="112" r="22" fill="none" stroke="#ffd54a" stroke-width="3" class="v-ping" ${D(2.85)}/>
 <g class="v-cur"><path d="M0 0l0 26 7-7 6 13 5-2-6-13 10 0z" fill="#fff" stroke="#111" stroke-width="1.5"/></g>
 <g class="v-fade" ${D(1.4)}>${T(320,48,17,'١- اضغط على الطرف الأول')}</g><g class="v-fade" ${D(2.8)}>${T(320,74,17,'٢- ثم على الطرف الثاني')}</g>
 <g class="v-pop" ${D(3.2)}>${T(320,300,20,'✔ تمّ توصيل السلك','fill="#4cd07d" font-weight="700"')}</g>
 <g class="v-fade" ${D(5.5)}><rect x="170" y="318" width="300" height="34" rx="10" fill="#1b2638" stroke="#2c3b52"/>${T(320,341,14,'＋ أضف القطع وحرّكها من شريط الأدوات')}</g>`)},
{t:'التشغيل',min:8,say:'بَعْدَ التَّوْصِيلْ شَغِّل الكَهْرَبَاءْ وَاضْغَطْ زِرَّ التَّشْغِيلْ، فَتَرَى الكُونْتَاكْتُور يَعْمَل، وَاللَّمْبَةُ تُضِيء، وَالمُحَرِّكْ يَدُور، تَمَامَاً كَمَا فِي الوَاقِعْ.',
 svg:SV(`<g stroke="#59636f" stroke-width="5" fill="none"><path d="M120 150H184M236 150H306M374 150H472M374 110H440V96"/></g>
 <g fill="none" stroke="#ffd54a" stroke-width="5"><g class="v-fade" ${D(1)}><path class="v-flow" d="M120 150H184"/></g><g class="v-fade" ${D(3.3)}><path class="v-flow" d="M236 150H306M374 150H472M374 110H440V96"/></g></g>
 <rect x="60" y="110" width="60" height="80" rx="6" fill="#ececec" stroke="#9aa3ad"/><circle cx="90" cy="150" r="20" fill="#d8322b"/><g class="v-turn" ${D(.6)}><rect x="86" y="128" width="8" height="44" rx="3" fill="#ffd54a"/></g>
 ${btn(210,150,'#1a8a42',2.9)}${contactor(340,150,3.2)}${lamp(440,74,'#4cd07d',3.3)}${motor(530,150,56,3.4)}
 ${T(90,222,14,'مفتاح رئيسي')}${T(210,222,14,'زر التشغيل')}${T(340,232,14,'كونتاكتور')}${T(530,240,14,'المحرك')}
 <g class="v-pop" ${D(.9)}>${T(90,92,14,'ON','fill="#4cd07d" font-weight="700"')}</g>
 <g class="v-pop" ${D(4.6)}>${T(320,300,21,'✔ المحرك يعمل','fill="#4cd07d" font-weight="700"')}</g>`)},

/* الصوت: أفضل صوت عربي متاح في الجهاز */
/* الصوت: يُفضَّل صوت عربي رجالي، ويمكن اختيار غيره من القائمة */
const SS=window.speechSynthesis,vSel=g('vVoice');let voice=null,arV=[];
const MALE=/naayf|hamed|shakir|hamdan|taim|fahed|moaz|\bali\b|abdullah|rami|omar|jamal|laith|hedi|saleh|ismael|bassel|maged|majed|tarik|x-ar[de]-|\bmale\b/i,
  FEM=/hoda|zariyah|salma|fatima|sana|amany|laila|layla|mouna|noura|rana|iman|reem|amina|mona|x-ar[cz]-|female/i,
  isM=v=>MALE.test(v.name+' '+v.voiceURI),
  score=v=>(isM(v)?100:FEM.test(v.name+' '+v.voiceURI)?-50:0)+(/google|natural|neural|online|premium|enhanced/i.test(v.name)?10:0)+(/SA/i.test(v.lang)?3:0);
const vName=v=>(v.name.replace(/microsoft|google|apple|online|\(natural\)|\s-\s.*$|\(.*?\)/gi,'').trim()||v.name)+(isM(v)?' ♂':'');
const pick=()=>{if(!SS)return;arV=SS.getVoices().filter(v=>/^ar/i.test(v.lang)).sort((a,b)=>score(b)-score(a));
  let want=null;try{want=localStorage.getItem('vidVoice');}catch(_){}
  voice=(want&&arV.find(v=>v.voiceURI===want))||arV[0]||null;
  vSel.innerHTML=arV.map(v=>`<option value="${v.voiceURI.replace(/"/g,'&quot;')}">${vName(v).replace(/</g,'&lt;')}</option>`).join('');
  vSel.hidden=arV.length<2;if(voice)vSel.value=voice.voiceURI;};
if(SS){pick();SS.onvoiceschanged=pick;}
const voiceNote=()=>{if(!SS)return;
  if(!arV.length){if(SS.getVoices().length)note.textContent='لا يوجد صوت عربي مثبّت على هذا الجهاز؛ تابع الشرح المكتوب أسفل المشهد.';return;}
  note.textContent=voice&&isM(voice)?'':'إن كان الصوت نسائيًا '+(arV.length>1?'فاختر صوتًا آخر من قائمة الصوت أعلى الفيديو، أو ':'ف')+'ثبّت صوتًا عربيًا رجاليًا: في أندرويد من الإعدادات ← تحويل النص إلى كلام ← محرك Google ← العربية، وفي آيفون من الإعدادات ← تسهيلات الاستخدام ← المحتوى المنطوق ← الأصوات ← العربية ← ماجد.';};
vSel.onchange=()=>{voice=arV.find(v=>v.voiceURI===vSel.value)||voice;try{localStorage.setItem('vidVoice',vSel.value);}catch(_){}voiceNote();if(playing)show(cur);};
let ac=null;
const chime=()=>{if(muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime;
  [660,880].forEach((f,k)=>{const o=ac.createOscillator(),gn=ac.createGain(),s=t+k*.12;o.frequency.value=f;gn.gain.setValueAtTime(0,s);gn.gain.linearRampToValueAtTime(.05,s+.02);gn.gain.exponentialRampToValueAtTime(.0001,s+.5);o.connect(gn).connect(ac.destination);o.start(s);o.stop(s+.55);});}catch(_){}};

/* تسجيلات مختارة للتجربة: رقم المشهد ← رابط الملف */
const REC={};let au=null;
let cur=0,playing=false,muted=false,tok=0,tms=[];
const est=s=>Math.max(s.min*1000,s.say.replace(/[ً-ْ]/g,'').length*80);
const clr=()=>{tok++;tms.forEach(clearTimeout);tms=[];if(SS)SS.cancel();if(au){au.onended=au.onerror=null;au.pause();au=null;}};
prog.innerHTML=SC.map((s,k)=>`<button class="vseg" data-k="${k}" title="${s.t}" aria-label="المشهد ${k+1}: ${s.t}"><b><i></i></b></button>`).join('');
const segs=[...prog.querySelectorAll('i')];
const setPlay=p=>{playing=p;bPlay.textContent=p?'⏸':'▶';bPlay.title=p?'إيقاف مؤقت':'تشغيل';bPlay.setAttribute('aria-label',bPlay.title);vM.classList.toggle('vpaused',!p);};
function show(n){
  clr();const my=tok,s=SC[n],t0=Date.now(),ms=est(s);cur=n;endV.hidden=true;setPlay(true);
  art.innerHTML=s.svg;tag.textContent=`${n+1}/${SC.length} · ${s.t}`;cap.textContent=s.cap||s.say;
  segs.forEach((e,k)=>{e.style.transition='none';e.style.width=k<n?'100%':'0';});
  void segs[n].offsetWidth;segs[n].style.transition=`width ${ms}ms linear`;segs[n].style.width='100%';
  chime();
  let done=false;
  const next=()=>{if(my!==tok||done)return;done=true;segs[n].style.transition='width .3s';segs[n].style.width='100%';
    tms.push(setTimeout(()=>{if(my!==tok)return;n+1<SC.length?show(n+1):finish();},Math.max(0,s.min*1000-(Date.now()-t0))+900));};
  const tts=()=>{if(SS&&!muted){const u=new SpeechSynthesisUtterance(s.say);u.lang=voice?voice.lang:'ar-SA';if(voice)u.voice=voice;u.rate=.95;
    u.onend=next;u.onerror=()=>{if(my===tok)tms.push(setTimeout(next,Math.max(0,ms-(Date.now()-t0))));};SS.speak(u);tms.push(setTimeout(next,ms*1.7+3000));}
    else tms.push(setTimeout(next,ms));};
  const src=REC[n+1]||s.audio;
  if(src&&!muted){au=new Audio(src);
    au.onloadedmetadata=()=>{if(my===tok&&isFinite(au.duration)){segs[n].style.transition=`width ${Math.max(ms,au.duration*1000)}ms linear`;}};
    au.onended=next;au.onerror=()=>{if(my===tok){au=null;tts();}};
    au.play().catch(()=>{if(my===tok&&au){au=null;tts();}});}
  else tts();
}
function finish(){clr();setPlay(false);vM.classList.remove('vpaused');segs.forEach(e=>{e.style.transition='none';e.style.width='100%';});endV.hidden=false;}
function pause(){clr();setPlay(false);segs.forEach(e=>{const w=getComputedStyle(e).width;e.style.transition='none';e.style.width=w;});}
g('vAgain').onclick=()=>show(0);
bPlay.onclick=()=>playing?pause():show(cur);
g('vPrev').onclick=()=>show(Math.max(0,cur-1));
g('vNext').onclick=()=>cur+1<SC.length?show(cur+1):finish();
prog.onclick=e=>{const b=e.target.closest('.vseg');if(b)show(+b.dataset.k);};
bMute.onclick=()=>{muted=!muted;bMute.textContent=muted?'🔇':'🔊';bMute.title=muted?'تشغيل الصوت':'كتم الصوت';bMute.setAttribute('aria-label',bMute.title);if(playing)show(cur);};
addEventListener('keydown',e=>{if(e.key===' '&&e.target.tagName!=='BUTTON'){e.preventDefault();bPlay.click();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)pause();});
/* أداة تجربة التسجيلات */
const aIn=g('vAud'),aClr=g('vAudClr'),aInfo=g('vAudInfo');
const aShow=()=>{const k=Object.keys(REC).sort((a,b)=>a-b);aClr.hidden=!k.length;
  aInfo.innerHTML=k.length?'تسجيلات للمشاهد: <b>'+k.join('، ')+'</b>':'';};
aIn.onchange=()=>{const bad=[];for(const f of aIn.files){const m=f.name.match(/\d+/);const k=m&&+m[0];
    if(k>=1&&k<=SC.length){if(REC[k])URL.revokeObjectURL(REC[k]);REC[k]=URL.createObjectURL(f);}else bad.push(f.name);}
  aIn.value='';aShow();if(bad.length)aInfo.innerHTML+=' — لم يُعرف رقم المشهد في: '+bad.join('، ').replace(/</g,'&lt;');show(0);};
aClr.onclick=()=>{for(const k in REC){URL.revokeObjectURL(REC[k]);delete REC[k];}aShow();if(playing)show(cur);};
/* أول مشهد يُعرض متوقفًا؛ اضغط ▶ للتشغيل (المتصفح يمنع الصوت قبل أول ضغطة) */
art.innerHTML=SC[0].svg;tag.textContent=`1/${SC.length} · ${SC[0].t}`;cap.textContent=SC[0].cap||SC[0].say;setPlay(false);
note.textContent=SS?'':'هذا المتصفح لا يدعم النطق الصوتي؛ تابع الشرح المكتوب أسفل المشهد.';
if(SS)setTimeout(()=>{if(!arV.length)pick();voiceNote();},1500);
})();
