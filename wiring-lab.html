<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d91">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<title>ورشة تحضير الأسلاك (تجريبية)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6ebf0;--ink:#15202b;--muted:#586675;--panel:#fff;--line:#c8d2dc;--accent:#1f5fbf;--warn:#c42b22;--ok:#1a8a42;--chip:#eef2f6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f151c;--ink:#e5eaef;--muted:#93a0ad;--panel:#18212b;--line:#2a3846;--accent:#6ea4ff;--warn:#ff6b60;--ok:#4cd07d;--chip:#212d39}}
:root[data-theme="dark"]{--bg:#0f151c;--ink:#e5eaef;--muted:#93a0ad;--panel:#18212b;--line:#2a3846;--accent:#6ea4ff;--warn:#ff6b60;--ok:#4cd07d;--chip:#212d39}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;font-size:15px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit}
.hd{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--bg);flex:none}
.hd h1{margin:0;font-size:1.02rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd h1 small{display:block;font-size:.72rem;font-weight:400;color:var(--muted)}
.b{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 10px;cursor:pointer;white-space:nowrap;font-size:.9rem}
.b.prim{background:#1f5fbf;border-color:#1f5fbf;color:#fff;font-weight:700}
.b.big{font-size:1.05rem;padding:9px 16px;font-weight:700}
.b:disabled{opacity:.45;cursor:default}
.tag{background:#ffb300;color:#1c1400;border-radius:999px;padding:1px 9px;font-size:.72rem;font-weight:700}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#sv{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.bar{flex:none;background:rgba(11,19,30,.96);color:#fff;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
.msg{font-size:.98rem;font-weight:500;min-height:1.5em;text-align:center}
.msg b{color:#ffd24a}
.note{font-size:.84rem;text-align:center;min-height:1.2em}
.note.ok{color:#6fe39a}.note.bad{color:#ff8a80}.note.warn{color:#ffd24a}
.btns{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.btns .b{background:#223142;border-color:#3b5068;color:#fff}
.btns .b.prim{background:#1f6fd1;border-color:#4a90e2}
.btns .b.sq{background:#c62828;border-color:#ff6b60}
.tasks{position:absolute;inset-inline-start:8px;top:58px;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.8rem;box-shadow:0 6px 18px rgba(0,0,0,.18);max-width:260px}
.tasks summary{cursor:pointer;font-weight:700}
.tasks ol{margin:4px 0 0;padding-inline-start:18px}
.tasks li.done{color:var(--ok);text-decoration:line-through}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;border:1px solid rgba(0,0,0,.35)}
@keyframes fall{to{transform:translateY(240px) rotate(70deg);opacity:0}}
.fall{animation:fall .9s ease-in forwards;transform-box:fill-box;transform-origin:center}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(-540deg)}}
.spin{animation:spin .7s ease-in-out;transform-box:fill-box;transform-origin:center}
@keyframes hl{50%{opacity:.25}}
.hl{animation:hl 1s infinite}
</style>
</head>
<body>
<div class="hd">
  <a class="b" href="index.html" style="text-decoration:none">↩ المحاكي</a>
  <h1>ورشة تحضير الأسلاك <span class="tag">تجريبية</span><small>اسحب السلك من اللفة، اقطعه، اعرِّ طرفيه، ثم اربطه في الترمينال</small></h1>
  <button class="b" id="bReset" title="إزالة كل الأسلاك والبدء من جديد">⟲ من جديد</button>
</div>
<details class="tasks"><summary id="tSum">📋 التمرين</summary><ol id="tasks"></ol></details>
<div class="stage"><svg id="sv" viewBox="0 0 1000 1320" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div class="bar">
  <div class="msg" id="msg"></div>
  <div class="note" id="note"></div>
  <div class="btns" id="btns"></div>
</div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),sv=$('sv');
/* ---------- the board: wire coils hang on the left side, the panel is on the right, the work bench below ---------- */
const COILS=[{c:'#7a4a21',n:'بني'},{c:'#1f6fd1',n:'أزرق'},{c:'#c62828',n:'أحمر'},{c:'#222',n:'أسود'},{c:'#8a8f94',n:'رمادي'},{c:'ye',n:'أصفر/أخضر'}];
const coilY=i=>95+i*98,CX=95;
const TT={ /* terminals: x, y, label */
  'X1.L':[265,350,'L'],'X1.N':[320,350,'N'],
  'F1.1':[430,160,'1'],'F1.2':[430,350,'2'],
  'S1.13':[560,160,'13'],'S1.14':[560,350,'14'],
  'K1.A1':[692,160,'A1'],'K1.1':[737,160,'1'],'K1.3':[777,160,'3'],'K1.5':[817,160,'5'],'K1.13':[860,160,'13'],
  'K1.A2':[692,350,'A2'],'K1.2':[737,350,'2'],'K1.4':[777,350,'4'],'K1.6':[817,350,'6'],'K1.14':[860,350,'14']};
const TASKS=[['X1.L','F1.1',0,'من الشعبة L إلى دخل القاطع F1'],['F1.2','S1.13',2,'من خرج القاطع F1 إلى الضاغط S1 (13)'],
  ['S1.14','K1.A1',2,'من الضاغط S1 (14) إلى ملف الكونتاكتور A1'],['K1.A2','X1.N',1,'من A2 إلى شعبة التعادل N']];
const tName=k=>({'X1.L':'الشعبة L','X1.N':'الشعبة N','F1.1':'F1 طرف 1','F1.2':'F1 طرف 2','S1.13':'S1 طرف 13','S1.14':'S1 طرف 14'})[k]||k.replace('K1.','K1 طرف ');
const coilFill=i=>COILS[i].c==='ye'?'url(#ye)':COILS[i].c;
/* ---------- state ---------- */
let W=[];try{W=JSON.parse(localStorage.getItem('wlab.v1')||'[]')||[];}catch(_){W=[];}
const saveW=()=>{try{localStorage.setItem('wlab.v1',JSON.stringify(W));}catch(_){}};
const S={st:'coil',a:null,b:null,need:0,coil:null,f1:false,s1:false,len:0,end:0,ends:[0,0],tx:0,ty:0,sq:false,pull:0,pull0:0,sel:null,inst:0,spin:null};
const CUT={y:860,x0:930,k:.7,ppc:8},CLO={y:880,ex:760,k:.8,ppm:12};
/* the tool zones in tool coordinates (pivot at 0,0, jaws upward): top = stripper notch, bottom = cutter */
const ZS=[-150,-80],ZC=[-70,-12];
function zone(){const v=S.st==='cut'?CUT:CLO,k=v.k,d=v.y-S.ty;
  if(d>=ZS[0]*k&&d<=ZS[1]*k)return 'S';if(d>=ZC[0]*k&&d<=ZC[1]*k)return 'C';return null;}
/* ---------- sound ---------- */
let AC=null;const ac=()=>{try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();}catch(_){}return AC;};
function snd(kind){const a=ac();if(!a)return;const t=a.currentTime,n=a.sampleRate*(kind==='cut'?.06:.03),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,kind==='cut'?3:6);const s=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();
  f.type=kind==='cut'?'highpass':'bandpass';f.frequency.value=kind==='cut'?2500:900;g.gain.value=kind==='clk'?.5:.35;s.buffer=b;s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);}
/* ---------- drawing ---------- */
const defs=`<defs>
<pattern id="ye" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="22" height="22" fill="#2e9e3f"/><rect width="11" height="22" fill="#f2d33a"/></pattern>
<pattern id="holes" width="22" height="22" patternUnits="userSpaceOnUse"><rect width="22" height="22" fill="#cfd5da"/><rect x="8" y="8" width="6" height="6" rx="1.5" fill="#aeb6bd"/></pattern>
<linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c79a62"/><stop offset="1" stop-color="#a87a45"/></linearGradient>
<linearGradient id="rail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9edf0"/><stop offset=".5" stop-color="#aeb6bd"/><stop offset="1" stop-color="#d8dde1"/></linearGradient>
<linearGradient id="dev" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9dcdf"/><stop offset=".15" stop-color="#f4f5f6"/><stop offset=".85" stop-color="#eceef0"/><stop offset="1" stop-color="#c9cdd1"/></linearGradient>
<radialGradient id="screw" cx=".35" cy=".35" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#c9ced3"/><stop offset="1" stop-color="#7c858d"/></radialGradient>
<linearGradient id="cu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd2a0"/><stop offset=".45" stop-color="#d9823f"/><stop offset="1" stop-color="#8f4a1c"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></linearGradient>
<linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5f676e"/><stop offset=".45" stop-color="#d7dce0"/><stop offset="1" stop-color="#6b737a"/></linearGradient>
<linearGradient id="skin" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b9774f"/><stop offset=".5" stop-color="#e2a57c"/><stop offset="1" stop-color="#c5835b"/></linearGradient>
<linearGradient id="grip" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8d1414"/><stop offset=".5" stop-color="#e53935"/><stop offset="1" stop-color="#8d1414"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity=".35"/></filter>
</defs>`;
const T=(x,y,t,s,c,w,a)=>`<text x="${x}" y="${y}" text-anchor="${a||'middle'}" style="font:${w||700} ${s}px 'IBM Plex Sans Arabic',sans-serif;fill:${c||'#222'}">${t}</text>`;
function coil(i){const y=coilY(i),f=coilFill(i),sel=S.coil===i,can=S.st==='coil';
  let s=`<g data-coil="${i}" style="cursor:${can?'pointer':'default'}"><line x1="${CX}" y1="${y-60}" x2="${CX}" y2="${y-30}" stroke="#555" stroke-width="5"/>`;
  s+=`<circle cx="${CX}" cy="${y}" r="46" fill="#2a2f35"/>`;
  for(let r=42;r>16;r-=4)s+=`<circle cx="${CX}" cy="${y}" r="${r}" fill="none" stroke="${f}" stroke-width="4.2"/><circle cx="${CX}" cy="${y}" r="${r}" fill="none" stroke="rgba(0,0,0,.25)" stroke-width=".8"/>`;
  s+=`<circle cx="${CX}" cy="${y}" r="42" fill="url(#sheen)" opacity=".6"/><circle cx="${CX}" cy="${y}" r="15" fill="#3b4148" stroke="#111" stroke-width="2"/><circle cx="${CX}" cy="${y}" r="6" fill="#777" stroke="#222"/>`;
  s+=`<path d="M${CX+40} ${y+12} q22 18 18 52" fill="none" stroke="${f}" stroke-width="5" stroke-linecap="round"/><rect x="${CX+53}" y="${y+60}" width="5" height="9" fill="url(#cu)"/>`;
  s+=`<title>${COILS[i].n} 1.5 مم²</title>`;
  if(sel)s+=`<circle cx="${CX}" cy="${y}" r="50" fill="none" stroke="#ffb300" stroke-width="5"/>`;
  else if(can)s+=`<circle class="hl" cx="${CX}" cy="${y}" r="50" fill="none" stroke="#ffd24a" stroke-width="3" stroke-dasharray="8 6"/>`;
  return s+`<circle cx="${CX}" cy="${y}" r="55" fill="transparent"/></g>`;}
function term(k){const [x,y,l]=TT[k],act=false,pick=S.st==='inst'&&k===S.a,top=y<250;
  let s=`<g data-term="${k}" style="cursor:pointer"><rect x="${x-17}" y="${y-17}" width="34" height="34" rx="5" fill="#2b3036"/><circle cx="${x}" cy="${y}" r="13" fill="url(#screw)" stroke="#555"/><path d="M${x-8} ${y+5}L${x+8} ${y-5}" stroke="#444" stroke-width="3"/>`;
  s+=T(x,top?y+36:y-24,l,15,'#1d2329');
  if(pick)s+=`<circle cx="${x}" cy="${y}" r="24" fill="none" stroke="#ffb300" stroke-width="5"/>`;
  else if(act&&(S.st!=='a'||true))s+=`<circle class="hl" cx="${x}" cy="${y}" r="22" fill="none" stroke="${S.st==='inst'?'#2ecc71':'#ffd24a'}" stroke-width="3"/>`;
  return s+`<circle cx="${x}" cy="${y}" r="32" fill="transparent"/></g>`;}
function panel(){let s=`<rect x="190" y="20" width="800" height="600" rx="10" fill="#9aa3ab"/><rect x="200" y="30" width="780" height="580" rx="6" fill="url(#holes)"/>`;
  s+=`<rect x="200" y="235" width="780" height="40" fill="url(#rail)" stroke="#8a939a"/>`;
  /* trunking at top and bottom */
  s+=`<rect x="200" y="30" width="780" height="70" fill="#ececec" stroke="#b9bfc4"/><rect x="200" y="530" width="780" height="80" fill="#ececec" stroke="#b9bfc4"/>`;
  for(let x=210;x<980;x+=26){s+=`<rect x="${x}" y="30" width="14" height="22" fill="#d6d9dc"/><rect x="${x}" y="588" width="14" height="22" fill="#d6d9dc"/>`;}
  /* supply cable into X1 */
  s+=`<path d="M265 0V100" stroke="#5a3415" stroke-width="9"/><path d="M265 0V100" stroke="#7a4a21" stroke-width="6"/><path d="M320 0V100" stroke="#164e93" stroke-width="9"/><path d="M320 0V100" stroke="#1f6fd1" stroke-width="6"/>`+T(292,18,'230V',14,'#fff');
  /* X1 terminals */
  [['L',265,'#9ea4aa'],['N',320,'#1f6fd1']].forEach(([n,x,c])=>{s+=`<g filter="url(#sh)"><rect x="${x-25}" y="110" width="50" height="270" rx="5" fill="${c}" stroke="#555"/><rect x="${x-25}" y="215" width="50" height="80" fill="rgba(255,255,255,.18)"/></g>`+
    `<rect x="${x-17}" y="113" width="34" height="34" rx="5" fill="#2b3036"/><circle cx="${x}" cy="130" r="13" fill="url(#screw)" stroke="#555"/>`+T(x,262,n,24,'#fff',800);});
  s+=`<path d="M265 100V130M320 100V130" stroke="#d9823f" stroke-width="4"/>`+T(292,400,'X1',15,'#1d2329');
  /* F1 */
  s+=`<g filter="url(#sh)"><rect x="395" y="110" width="70" height="270" rx="6" fill="url(#dev)" stroke="#8a939a"/></g><rect x="405" y="200" width="50" height="22" rx="3" fill="#1f5fbf"/>`+T(430,216,'C6',14,'#fff')+
    `<g data-act="f1" style="cursor:pointer"><rect x="412" y="232" width="36" height="56" rx="6" fill="#2b3036"/><rect x="417" y="${S.f1?236:262}" width="26" height="22" rx="4" fill="${S.f1?'#1a8a42':'#c62828'}"/>${T(430,S.f1?252:278,S.f1?'I':'0',13,'#fff')}</g>`+T(430,400,'F1',15,'#1d2329');
  /* S1 modular push button */
  s+=`<g filter="url(#sh)"><rect x="525" y="110" width="70" height="270" rx="6" fill="url(#dev)" stroke="#8a939a"/></g><g data-act="s1" style="cursor:pointer"><circle cx="560" cy="255" r="26" fill="#2b3036"/><circle cx="560" cy="255" r="${S.s1?17:20}" fill="#2e9e3f" stroke="#145c22" stroke-width="3"/></g>`+T(560,400,'S1',15,'#1d2329');
  /* K1 contactor */
  const on=coilOn();
  s+=`<g filter="url(#sh)"><rect x="665" y="110" width="220" height="270" rx="8" fill="url(#dev)" stroke="#8a939a"/></g><rect x="712" y="210" width="126" height="78" rx="6" fill="#d0d4d8" stroke="#8a939a"/>`+
    `<rect x="745" y="${on?232:222}" width="60" height="40" rx="4" fill="${on?'#1a8a42':'#a7adb3'}" stroke="#555"/>${T(775,on?258:248,on?'I':'O',16,'#fff')}`+T(775,400,'K1',15,'#1d2329')+
    (on?T(775,300,'⚡ يعمل',14,'#1a8a42',800):'');
  Object.keys(TT).forEach(k=>{s+=term(k);});
  return s;}
function wirePath(w){const [ax,ay]=TT[w.a],[bx,by]=TT[w.b],da=ay<250?-1:1,db=by<250?-1:1;
  return `M${ax} ${ay}C${ax} ${ay+da*120} ${bx} ${by+db*120} ${bx} ${by}`;}
function handWire(){if(S.st!=='inst'||!S.inst||!S.hp)return '';const [ax,ay]=TT[S.a],{x,y}=S.hp,da=ay<250?-1:1,c=coilFill(S.coil);
  const d=`M${ax} ${ay}C${ax} ${ay+da*120} ${x} ${y+70} ${x} ${y}`;
  return `<g pointer-events="none"><path d="${d}" fill="none" stroke="rgba(0,0,0,.55)" stroke-width="10" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${c}" stroke-width="7" stroke-linecap="round"/>
  <rect x="${x-3}" y="${y-16}" width="6" height="14" fill="url(#cu)"/>
  <g transform="translate(${x} ${y}) scale(.42)"><path d="M-30 20 Q-58 60 -46 120 Q-30 170 20 172 Q66 168 70 118 Q74 60 44 24 Z" fill="url(#skin)" stroke="#8f5a39" stroke-width="3"/>
  <path d="M-30 30 Q-40 -10 -8 -4 Q4 8 -4 40 Z" fill="url(#skin)" stroke="#8f5a39" stroke-width="3"/><path d="M8 34 Q20 -6 40 2 Q50 16 34 44 Z" fill="url(#skin)" stroke="#8f5a39" stroke-width="3"/>
  <path d="M-40 150 L60 150 L64 210 L-44 214 Z" fill="#244b7a" stroke="#132c4a" stroke-width="3"/></g></g>`;}
function wiresSvg(){let s='';W.forEach((w,i)=>{const d=wirePath(w),c=coilFill(w.c),sel=S.sel===i;
    s+=`<g data-wire="${i}" style="cursor:pointer"><path d="${d}" fill="none" stroke="transparent" stroke-width="26"/>${sel?`<path d="${d}" fill="none" stroke="#ffb300" stroke-width="15" stroke-linecap="round"/>`:''}<path d="${d}" fill="none" stroke="rgba(0,0,0,.55)" stroke-width="10" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${c}" stroke-width="7" stroke-linecap="round"/><path d="${d}" fill="none" stroke="url(#sheen)" stroke-width="3" opacity=".5"/>`;
    [[w.a,w.sa],[w.b,w.sb]].forEach(([k,m])=>{const [x,y]=TT[k],dy=y<250?-1:1;
      if(m>12)s+=`<rect x="${x-3}" y="${dy<0?y-17-(m-11)*1.8:y+17}" width="6" height="${(m-11)*1.8}" fill="url(#cu)"/>`+T(x+26,y+dy*30,'⚠',20,'#d99000');
      if(m<7)s+=T(x+26,y+dy*30,'✖',20,'#c62828');});
    s+='</g>';});
  return s;}
/* the combined tool: two halves rotating on the pivot; stripper notches at the top of the jaws, cutting edges below them */
function tool(k,open){const a=open?13:1.5,jaw=side=>{const m=side<0?-1:1;
    let p=`<path d="M0 -6 L${m*24} -14 L${m*20} -150 Q${m*12} -168 0 -160 Z" fill="url(#steel)" stroke="#3d444a" stroke-width="1.5"/>`;
    [-138,-115,-94].forEach((y,i)=>{p+=`<path d="M0 ${y-5-i} A${5+i} ${5+i} 0 0 ${m>0?1:0} 0 ${y+5+i}" fill="#2d3236" stroke="#111"/>`;});
    p+=`<path d="M${m*1} -70 L${m*7} -64 L${m*7} -18 L${m*1} -12" fill="#eef2f5" stroke="#555" stroke-width="1"/>`;
    return p;},
    handle=side=>{const m=side<0?-1:1;return `<path d="M${-m*10} 10 L${m*30} 250 Q${m*36} 272 ${m*52} 262 L${m*22} 8 Z" fill="url(#grip)" stroke="#5d0c0c" stroke-width="1.5"/><path d="M${-m*10} 10 L${m*12} 90" stroke="#4d555c" stroke-width="10"/>`;};
  let s=`<g transform="scale(${k})"><rect x="-75" y="-175" width="155" height="580" fill="transparent"/><g transform="rotate(${-a})">${jaw(-1)}${handle(1)}</g><g transform="rotate(${a})">${jaw(1)}${handle(-1)}</g>`;
