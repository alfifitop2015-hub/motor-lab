<style>
:root{--bg:#e6ebf0;--ink:#15202b;--muted:#586675;--panel:#fff;--line:#c8d2dc;--accent:#1f5fbf;--warn:#c42b22;--ok:#1a8a42;--amber:#d99000;--chip:#eef2f6;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f151c;--ink:#e5eaef;--muted:#93a0ad;--panel:#18212b;--line:#2a3846;--accent:#6ea4ff;--warn:#ff6b60;--ok:#4cd07d;--amber:#ffbf3c;--chip:#212d39;}}
:root[data-theme="dark"]{--bg:#0f151c;--ink:#e5eaef;--muted:#93a0ad;--panel:#18212b;--line:#2a3846;--accent:#6ea4ff;--warn:#ff6b60;--ok:#4cd07d;--amber:#ffbf3c;--chip:#212d39;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;font-size:15px;line-height:1.5}
button,select,input{font:inherit;color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar1{display:flex;align-items:center;gap:8px;padding:8px 10px 6px}
.bar1 h1{flex:1;font-size:1.02rem;line-height:1.3;margin:0}
.bar1 h1 .credit{display:block;font-size:.72rem;font-weight:500;color:var(--muted)}
.tbadge{background:#0b3d91;color:#fff;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700;flex:none}
.ib{min-width:40px;height:38px;border:1px solid var(--line);background:var(--panel);border-radius:9px;font-size:.95rem;font-weight:700;cursor:pointer;flex:none;padding:0 10px;display:inline-flex;align-items:center;gap:4px}
.top,.ops,.tabs,.panel,.stats{zoom:var(--ui,1)}
.stats{display:flex;flex-wrap:wrap;gap:6px;padding:6px 10px}
.stats span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.85rem}
.stats b{font-variant-numeric:tabular-nums}
.stats .bad{color:var(--warn)}.stats .good{color:var(--ok)}
.scene{overflow-x:auto;direction:ltr;background:#cfd6dc;border-block:1px solid var(--line)}
.scene svg{display:block;width:100%;min-width:760px;height:auto}
.ops{display:flex;flex-wrap:wrap;gap:8px;padding:8px 10px;align-items:center}
.ob{display:inline-flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:6px 10px;min-width:74px;cursor:pointer;font-size:.8rem;font-weight:700;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.ob i{display:block;width:30px;height:30px;border-radius:50%;border:3px solid rgba(0,0,0,.25);font-style:normal;color:#fff;line-height:24px;text-align:center;font-size:.8rem}
.ob.down i{transform:scale(.88);box-shadow:inset 0 3px 6px rgba(0,0,0,.45)}
.ob.on{outline:3px solid var(--accent)}
.lamps{display:flex;gap:10px;margin-inline-start:auto;align-items:center;font-size:.8rem;font-weight:700}
.lamp{display:flex;flex-direction:column;align-items:center;gap:2px}
.lamp i{width:22px;height:22px;border-radius:50%;border:2px solid #555;background:#3a3f44}
.tabs{display:flex;gap:4px;padding:6px 10px 0;overflow-x:auto;border-bottom:1px solid var(--line)}
.tab{border:1px solid var(--line);border-bottom:0;background:var(--chip);border-radius:10px 10px 0 0;padding:7px 12px;cursor:pointer;white-space:nowrap;font-weight:700;font-size:.9rem}
.tab[aria-selected="true"]{background:var(--panel);color:var(--accent)}
.panel{background:var(--panel);padding:10px 12px 40px;min-height:40vh}
.panel h3{margin:.4em 0 .3em;font-size:1rem}
.panel p,.panel li{font-size:.92rem}
.lad{direction:ltr;overflow-x:auto}
.lad svg{display:block;width:100%;min-width:560px;height:auto}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;cursor:pointer;white-space:nowrap;font-weight:700}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.red{color:var(--warn)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
table.io{border-collapse:collapse;font-size:.88rem;width:100%;max-width:640px}
table.io td,table.io th{border:1px solid var(--line);padding:3px 8px;text-align:start}
table.io th{background:var(--chip)}
.flt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;cursor:pointer}
.flt input{margin-top:5px;width:18px;height:18px;flex:none}
.flt small{display:block;color:var(--muted)}
.flt.on{border-color:var(--warn);background:rgba(196,43,34,.06)}
.ed{border:1px solid var(--line);border-radius:10px;padding:6px 8px;margin:6px 0;direction:ltr}
.ed .el{display:inline-flex;flex-direction:column;gap:2px;border:1px dashed var(--line);border-radius:8px;padding:4px;margin:2px;vertical-align:top}
.ed select,.ed input{font-size:.85rem;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.ed .x{border:0;background:none;color:var(--warn);cursor:pointer;font-weight:700}
.ed .n{font-weight:700;color:var(--muted);margin-inline-end:6px}
.note{background:var(--chip);border-radius:10px;padding:8px 10px;font-size:.9rem}
.msg{padding:6px 10px;font-size:.88rem;font-weight:700;color:#fff;background:#1a3a5c}
.msg.err{background:var(--warn)}

  <button class="ob" data-p="S1" title="S1 تشغيل الخط (NO)"><i style="background:#2aa84a">I</i>تشغيل S1</button>

  <button class="ob" id="oS9" title="S9 طوارئ (يبقى مضغوطًا حتى يُفك)"><i style="background:#c00;border-color:#f5d000">!</i>طوارئ S9</button>

  <div class="lamps"><div class="lamp"><i id="H1"></i>H1 يعمل</div><div class="lamp"><i id="H3"></i>H3 دفعة</div><div class="lamp"><i id="H2"></i>H2 عطل</div></div>

<script>
(function(){
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const EMB=window.parent&&window.parent!==window&&typeof window.parent.__lnClose==='function';
$('bBack').onclick=()=>{if(EMB)window.parent.__lnClose();else location.href='index.html';};

/* ---------- the line: positions on the scene ---------- */
const XS=430,XR=780,XE=1080,XEND=1120,BELT_Y=300,PW=44,PH=30,VB=90;
/* PLC I/O: what each address is wired to on this line */
const IOC={I1:'K1 الخط في وضع التشغيل',I2:'B1 قطعة تحت المكبس',I3:'1B1 المكبس فوق',I4:'1B2 المكبس تحت',I5:'B2 قطعة عند الفرز',I6:'B3 الكاميرا: القطعة معيبة',I7:'B4 قطعة في نهاية الخط',I8:'S2 تصفير العداد',
  Q1:'K2 محرك السير',Q2:'1Y1 إنزال المكبس',Q3:'2Y1 ذراع الطرد',Q4:'H3 اكتملت الدفعة',M1:'دورة الختم',M2:'دورة الطرد',M3:'القطعة خُتمت',M4:'',T1:'زمن الختم',T2:'زمن الطرد',T3:'',C1:'عداد الدفعة',C2:''};
const OPS=['I1','I2','I3','I4','I5','I6','I7','I8','Q1','Q2','Q3','Q4','M1','M2','M3','M4','T1','T2','T3','C1','C2'];
const c_=(a,n)=>({a,n:!!n});
/* the default program, rung by rung (easy-style coils: = coil, S set, R reset, TT timer, CC count, RC reset counter) */
const PROG0=[
 {s:[c_('I2'),c_('M3',1)],t:'S',o:'M1',r:'قطعة وصلت تحت المكبس ولم تُختم بعد: ابدأ دورة الختم'},
 {s:[c_('M1'),c_('M3',1)],t:'=',o:'Q2',r:'أنزل المكبس حتى تُختم القطعة'},
 {s:[c_('M1'),c_('I4')],t:'TT',o:'T1',p:1,r:'المكبس وصل تحت: اضغط ثانية واحدة'},
 {s:[c_('T1')],t:'S',o:'M3',r:'انتهى الضغط: القطعة خُتمت، فيرتفع المكبس'},
 {s:[c_('M3'),c_('I3')],t:'R',o:'M1',r:'المكبس رجع فوق: انتهت دورة الختم'},
 {s:[c_('I2',1)],t:'R',o:'M3',r:'خرجت القطعة من المكبس: استعد للقطعة التالية'},
 {s:[c_('I5'),c_('I6')],t:'S',o:'M2',r:'قطعة معيبة عند الفرز: ابدأ الطرد'},
 {s:[c_('M2')],t:'=',o:'Q3',r:'أخرج ذراع الطرد'},
 {s:[c_('M2')],t:'TT',o:'T2',p:.8,r:'زمن خروج الذراع'},
 {s:[c_('T2')],t:'R',o:'M2',r:'انتهى الطرد: أرجع الذراع'},
 {s:[c_('I1'),c_('M1',1),c_('M2',1),c_('C1',1)],t:'=',o:'Q1',r:'السير يتحرك إذا كان الخط يعمل ولا ختم ولا طرد ولم تكتمل الدفعة'},
 {s:[c_('I7')],t:'CC',o:'C1',p:10,r:'عدّ القطع الواصلة إلى نهاية الخط'},
 {s:[c_('I8')],t:'RC',o:'C1',r:'S2 يصفّر العداد'},
 {s:[c_('C1')],t:'=',o:'Q4',r:'اكتملت الدفعة: أضئ H3'}];
const clone=o=>JSON.parse(JSON.stringify(o));
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(_){return null;}};

/* ---------- state ---------- */
const S={Q0:true,S9:false,pr:new Set(),K1:false,K2:false,run:true,prog:(()=>{try{const p=JSON.parse(ls('lnProg'));if(Array.isArray(p)&&p.length)return p;}catch(_){}return clone(PROG0);})(),
  Q:{},M:{},T:{},C:{},I:{},st:0,pu:0,parts:[],nid:1,off:0,good:0,rej:0,err:0,flt:new Set(),hid:null,last:'',seq:0,mf:0};
const F=k=>S.flt.has(k);

/* ---------- PLC ---------- */
function ev(a){const k=a[0];if(k==='I')return !!S.I[a];if(k==='Q')return !!S.Q[a];if(k==='M')return !!S.M[a];
  if(k==='T'){const t=S.T[a];return !!t&&t.acc>=t.pre;}if(k==='C'){const c=S.C[a];return !!c&&c.cnt>=c.pre;}return false;}
const passE=(e,f)=>e.par?e.par.some(b=>b.every(x=>passE(x,f))):(f(e.a)!==e.n);
function scan(dt){S.prog.forEach(r=>{const v=r.s.every(e=>passE(e,ev));r._v=v;const o=r.o;
  if(r.t==='='||r.t==='S'||r.t==='R'){const m=o[0]==='Q'?S.Q:S.M;if(r.t==='=')m[o]=v;else if(v)m[o]=r.t==='S';}
  else if(r.t==='TT'){const t=S.T[o]||(S.T[o]={acc:0,pre:1});t.pre=+r.p||1;t.acc=v?Math.min(t.pre,t.acc+dt):0;}
  else if(r.t==='CC'){const c=S.C[o]||(S.C[o]={cnt:0,pre:10,l:false});c.pre=Math.max(1,+r.p||10);if(v&&!c.l)c.cnt++;c.l=v;}
  else if(r.t==='RC'){if(v&&S.C[o])S.C[o].cnt=0;}});}
function plcReset(){S.Q={};S.M={};S.T={};Object.values(S.C).forEach(c=>c.l=false);}

/* ---------- one step of the whole line ---------- */
const near=(x,c,w)=>Math.abs(x-c)<=w;
function step(dt){const P=S.parts.filter(p=>p.st==='belt');
  /* sensors */
  const at=(c,w)=>P.find(p=>near(p.x,c,w));
  const b1=at(XS,6),b2=at(XR,6),cam=at(XR,26);
  S.I={I1:S.K1,I2:!!b1&&!F('b1'),I3:S.st<.04,I4:S.st>.96&&!F('lim'),I5:!!b2,I6:!!cam&&(cam.def||F('cam')),I7:!!at(XE,6),I8:S.pr.has('S2')};
  /* the hardwired part: K1 holds itself through 13-14, F2 and the stops break it */
  const pw=S.Q0,stopOk=!S.S9&&!S.pr.has('S0')&&!F('ol');
  S.K1=pw&&stopOk&&(S.pr.has('S1')||(S.K1&&!F('hold')));
  /* the PLC (powered from Q0) */
  if(pw&&S.run)scan(dt);else{S.Q={};}
  S.K2=S.K1&&!!S.Q.Q1&&!F('q1')&&!F('ol');
  /* air: the valves and cylinders */
  const bar=F('air')?2:6,sp=bar/6*2.2;const y1=!!S.Q.Q2,y2=!!S.Q.Q3&&!F('coil');
  const hold=b1&&S.st>.5;S.st=Math.max(0,Math.min(1,S.st+(y1?1:-1)*sp*dt*(y1&&S.st>.75&&b1?.5:1)));
  S.pu=Math.max(0,Math.min(1,S.pu+(y2?1:-1)*sp*1.3*dt));S.bar=bar;
  if(b1&&S.st>=.97&&!b1.stp)b1.stp=true;
  if(S.pu>.9){const r=at(XR,26);if(r){r.st='rej';r.t=0;}}
  /* the belt */
  const run=S.K2;S.mv=run;
  if(run){S.off=(S.off+VB*dt)%40;const L=S.parts.filter(p=>p.st==='belt').sort((a,b)=>b.x-a.x);let lead=1e9;
    L.forEach(p=>{let nx=p.x+VB*dt;if(near(p.x,XS,26)&&S.st>.35)nx=p.x;nx=Math.min(nx,lead-PW-8);if(nx>p.x)p.x=nx;lead=p.x;});
    if(!S.parts.some(p=>p.st==='belt'&&p.x<200)&&S.mf<=0){S.seq++;S.parts.push({id:S.nid++,x:88,st:'belt',def:[0,0,1,0,0,0,1,0,0,1,0,0][S.seq%12]===1,stp:false});S.mf=1;}}
  S.mf-=dt;
  S.parts.forEach(p=>{if(p.st==='belt'&&p.x>=XEND){p.st='drop';p.t=0;}
    if(p.st==='drop'||p.st==='rej'){p.t+=dt/.6;if(p.t>=1){p.st='done';
      if(p.st0)return;p.st0=1;
      if(p.x>=XEND-1){if(p.def||!p.stp){S.err++;say(p.def?'⚠ قطعة معيبة وصلت إلى صندوق السليمة!':'⚠ قطعة غير مختومة وصلت إلى نهاية الخط!',1);}else S.good++;}
      else{S.rej++;if(!p.def){S.err++;say('⚠ طُردت قطعة سليمة!',1);}}}}});
  S.parts=S.parts.filter(p=>p.st!=='done');}

/* ---------- drawing the line ---------- */
const T=(x,y,s,sz,fill,wt,anc)=>`<text x="${x}" y="${y}" text-anchor="${anc||'middle'}" style="font:${wt||700} ${sz||12}px 'IBM Plex Sans Arabic',sans-serif;fill:${fill||'#1c2126'}">${s}</text>`;
const led=(x,y,on,c)=>`<circle cx="${x}" cy="${y}" r="4.5" fill="${on?(c||'#ffd000'):'#4a5157'}" stroke="#222"/>`;
function partSVG(p,x,y,rot){return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})${rot?` rotate(${rot})`:''}"><rect x="${-PW/2}" y="0" width="${PW}" height="${PH}" rx="3" fill="url(#gPart)" stroke="#55606a"/>
  ${p.def?`<path d="M-14 6l8 7l-3 5l9 8" fill="none" stroke="#c62828" stroke-width="2.4"/>`:''}${p.stp?`<circle cx="6" cy="15" r="8" fill="none" stroke="#0b3d91" stroke-width="2.4"/><path d="M2 15l3 3l6-6" fill="none" stroke="#0b3d91" stroke-width="2.2"/>`:''}</g>`;}
function sensor(x,lab,on){return `<g><rect x="${x-13}" y="${BELT_Y+24}" width="26" height="16" rx="3" fill="#2c3540"/>${led(x,BELT_Y+32,on,'#ff9800')}${T(x,BELT_Y+56,lab,11,'#0b1d33')}${on?`<path d="M${x} ${BELT_Y+24}V${BELT_Y+4}" stroke="#ff9800" stroke-width="2" stroke-dasharray="3 3"/>`:''}</g>`;}
function cyl(x,pos,lab,head,lim){const ht=172+pos*86;return `<g><rect x="${x-18}" y="70" width="36" height="100" rx="5" fill="#cfd6dc" stroke="#6b757d"/><rect x="${x-18}" y="70" width="36" height="${(10+pos*80).toFixed(1)}" fill="${pos>0||S.Q[lim[2]]?'rgba(31,111,229,.55)':'none'}"/>
  <rect x="${x-14}" y="${(76+pos*86).toFixed(1)}" width="28" height="8" fill="#3b4650"/><rect x="${x-4}" y="${(84+pos*86).toFixed(1)}" width="8" height="${(ht-84-pos*86).toFixed(1)}" fill="url(#gRod)" stroke="#777"/>
  <rect x="${x-head/2}" y="${ht.toFixed(1)}" width="${head}" height="12" rx="2" fill="#39424b"/>${T(x,62,lab,12,'#0b3d91')}
  ${lim[0]?`<rect x="${x+20}" y="74" width="22" height="12" rx="2" fill="#fff" stroke="#333"/>${led(x+31,80,S.I[lim[0]==='1B1'?'I3':'']||(lim[0]==='1B1'&&S.st<.04),'#2aa84a')}${T(x+50,84,lim[0],10,'#0b1d33',700,'start')}`:''}
  ${lim[1]?`<rect x="${x+20}" y="150" width="22" height="12" rx="2" fill="#fff" stroke="#333"/>${led(x+31,156,S.I.I4,'#2aa84a')}${T(x+50,160,lim[1],10,'#0b1d33',700,'start')}`:''}</g>`;}
function scene(){const lit=(c,on)=>on?c:'#4a5157';let o=`<defs><linearGradient id="gPart" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef2f5"/><stop offset="1" stop-color="#9aa6b0"/></linearGradient>
  <linearGradient id="gRod" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#c9ced3"/><stop offset="1" stop-color="#8d949a"/></linearGradient></defs>
  <rect width="1200" height="500" fill="#d5dbe0"/><rect y="440" width="1200" height="60" fill="#9aa4ac"/>`;
  /* control cabinet with the PLC and the relays */

/* ---------- ladder drawing (the PLC program and the hardwired circuit use the same drawing) ---------- */
const CW=96;
function elW(e){return e.par?Math.max(...e.par.map(b=>b.reduce((s,x)=>s+elW(x),0))):1;}
function elH(e){return e.par?e.par.reduce((s,b)=>s+Math.max(...b.map(elH)),0):1;}
function ladSVG(R,f,L){const RH=62;let y=8,o='';const W=40+Math.max(4,...R.map(r=>r.s.reduce((s,e)=>s+elW(e),0)))*CW+150;
  const contact=(e,x,yy)=>{const ok=f(e.a)!==e.n,c=ok?'#1a8a42':'#2a3440';const lb=L(e.a);
    return `<line x1="${x}" y1="${yy}" x2="${x+30}" y2="${yy}" stroke="${c}" stroke-width="2"/><line x1="${x+30}" y1="${yy-12}" x2="${x+30}" y2="${yy+12}" stroke="${c}" stroke-width="2.4"/><line x1="${x+46}" y1="${yy-12}" x2="${x+46}" y2="${yy+12}" stroke="${c}" stroke-width="2.4"/>${e.n?`<line x1="${x+28}" y1="${yy+12}" x2="${x+48}" y2="${yy-12}" stroke="${c}" stroke-width="2"/>`:''}
      ${ok?`<rect x="${x+31}" y="${yy-11}" width="14" height="22" fill="rgba(42,168,74,.25)"/>`:''}<line x1="${x+46}" y1="${yy}" x2="${x+CW}" y2="${yy}" stroke="${c}" stroke-width="2"/>${T(x+38,yy-17,esc(lb[0]),11,'#0b3d91')}${T(x+38,yy+26,esc(lb[1]||''),8.5,'#586675',500)}`;};
  const seq=(arr,x,yy)=>{let s='';arr.forEach(e=>{if(e.par){const w=elW(e);let by=yy;e.par.forEach((b,i)=>{let bx=x;s+=seq(b,bx,by);const bw=b.reduce((q,z)=>q+elW(z),0);if(bw<w)s+=`<line x1="${x+bw*CW}" y1="${by}" x2="${x+w*CW}" y2="${by}" stroke="#2a3440" stroke-width="2"/>`;
        if(i)s+=`<line x1="${x}" y1="${yy}" x2="${x}" y2="${by}" stroke="#2a3440" stroke-width="2"/><line x1="${x+w*CW}" y1="${yy}" x2="${x+w*CW}" y2="${by}" stroke="#2a3440" stroke-width="2"/>`;by+=Math.max(...b.map(elH))*RH;});x+=w*CW;}
      else{s+=contact(e,x,yy);x+=CW;}});return s;};
  R.forEach((r,i)=>{const h=Math.max(...r.s.map(elH),1)*RH,yy=y+26,ws=r.s.reduce((s,e)=>s+elW(e),0),xe=40+ws*CW,cx=W-110,on=!!r._v,cc=on?'#1a8a42':'#2a3440';
    o+=`<text x="4" y="${yy+4}" style="font:700 10px sans-serif;fill:#8a96a3">${i+1}</text>`+seq(r.s,40,yy)+`<line x1="${xe}" y1="${yy}" x2="${cx-16}" y2="${yy}" stroke="${cc}" stroke-width="2"/>
      <circle cx="${cx}" cy="${yy}" r="15" fill="${on?'#c8f0d4':'#fff'}" stroke="${cc}" stroke-width="2.4"/>${T(cx,yy+4,{'=':'','S':'S','R':'R','TT':'T','CC':'C','RC':'RC'}[r.t]||'',10,cc)}<line x1="${cx+15}" y1="${yy}" x2="${W-14}" y2="${yy}" stroke="${cc}" stroke-width="2"/>
      ${T(cx,yy-20,esc(L(r.o)[0])+(r.t==='TT'?` ${r.p}s`:r.t==='CC'?` =${r.p}`:''),11,'#0b3d91')}${T(cx,yy+30,esc(L(r.o)[1]||''),8.5,'#586675',500)}
      ${r.r?`<text x="44" y="${y+h+24}" text-anchor="start" style="font:500 10px 'IBM Plex Sans Arabic',sans-serif;fill:#7a5a00">${esc(r.r)}</text>`:''}`;
    y+=h+(r.r?40:22);});
  return `<svg viewBox="0 0 ${W} ${y+4}"><line x1="34" y1="0" x2="34" y2="${y}" stroke="#d8322b" stroke-width="4"/><line x1="${W-12}" y1="0" x2="${W-12}" y2="${y}" stroke="#1f5fbf" stroke-width="4"/>${o}</svg>`;}

/* the hardwired control circuit, drawn as rungs between the two supply lines */
const CONV=[
 {s:[c_('S9',1),c_('S0',1),{par:[[c_('S1')],[c_('K1h')]]},c_('F2',1)],t:'=',o:'K1',r:'التشغيل والإيقاف والطوارئ والحماية: K1 يمسك نفسه عن طريق تلامسه 13-14'},
 {s:[c_('K1b'),c_('Q1')],t:'=',o:'K2',r:'محرك السير: يلزم أن يكون الخط يعمل (K1) وأن يطلب PLC الحركة (Q1)'},
 {s:[c_('K1c')],t:'=',o:'H1',r:'لمبة الخط يعمل'},
 {s:[{par:[[c_('F2')],[c_('S9')]]}],t:'=',o:'H2',r:'لمبة العطل: فصل F2 أو ضغط الطوارئ'},
 {s:[c_('Q4')],t:'=',o:'H3',r:'لمبة اكتمال الدفعة من خرج PLC'}];
const CL={S9:['S9','طوارئ'],S0:['S0','إيقاف'],S1:['S1','تشغيل'],K1h:['K1','13-14 مسك'],F2:['F2','95-96 / 97-98'],K1b:['K1','23-24'],Q1:['Q1','خرج PLC'],K1c:['K1','33-34'],Q4:['Q4','خرج PLC'],
  K1:['K1','مرحل تشغيل الخط'],K2:['K2','كونتاكتور السير'],H1:['H1','أخضر'],H2:['H2','أحمر'],H3:['H3','أصفر']};
function cv(a){switch(a){case'S9':return S.S9;case'S0':case'S1':return S.pr.has(a);case'K1h':return S.K1&&!F('hold');case'K1b':case'K1c':return S.K1;case'F2':return F('ol');case'Q1':return !!S.Q.Q1&&!F('q1');case'Q4':return !!S.Q.Q4;}return false;}
function convSVG(){const pw=S.Q0;CONV.forEach(r=>{r._v=pw&&r.s.every(e=>passE(e,cv));});return ladSVG(CONV,a=>pw&&cv(a),a=>CL[a]||[a]);}
function powerSVG(){const on=S.Q0,m=S.K2,col=v=>v?'#d8322b':'#2a3440';let o='';

  o+=T(86,14,'L1  L2  L3',11,'#333')+box(36,30,'Q0',on?'مغلق':'مفتوح',on?'#1a8a42':'#c42b22')+box(84,30,'F1','مصهرات')+box(132,36,'K2',m?'مغلق: السير يعمل':'مفتوح',m?'#1a8a42':'#2a3440')+box(186,30,'F2',F('ol')?'فصل (حمل زائد)':'حماية حرارية',F('ol')?'#c42b22':'#2a3440');
  o+=`<circle cx="86" cy="270" r="30" fill="${m?'#c8f0d4':'#fff'}" stroke="#2a3440" stroke-width="2.4"/>${T(86,268,'M1',13)}${T(86,284,'3~',11)}`;
  return `<svg viewBox="0 0 300 310" style="max-width:380px;width:100%">${o}</svg>`;}

    o+=`<rect x="${vx-30}" y="${vy+8}" width="28" height="24" fill="${on?'#ffd000':'#fff'}" stroke="#1b2530"/>${T(vx-16,vy+25,y,10)}<path d="M${vx+2*s} ${vy+20}l6 -8l6 16l6 -16l6 8" fill="none" stroke="#1b2530"/>${T(vx+s,vy+s+18,v+' · 5/2',11,'#0b3d91')}

  if(TAB==='pn'){if(force)p.innerHTML=`<h3>الدائرة الهوائية (الأزرق الغامق عليه ضغط)</h3><div id="live"></div><p class="note">ملف الصمام يضيء أصفر عندما يعطيه PLC إشارة (Q2 للمكبس، Q3 للطرد). عند انقطاع الإشارة يرجع النابض الصمام فترجع الأسطوانة.</p>`;live(`<div class="lad">${pnSVG()}</div>`);return;}
  if(TAB==='flt'){if(!force)return;p.innerHTML=`<h3>أعطال يدخلها المدرب</h3><p class="note">اختر عطلاً، ثم اطلب من المتدربين ملاحظة العَرَض وتتبعه في الدوائر الثلاث حتى يحددوا مكانه.</p>
    <div class="row"><button class="btn pri" data-a="hid">🎲 عطل عشوائي مخفي</button><button class="btn" data-a="show" ${S.hid?'':'disabled'}>👁 إظهار العطل المخفي</button><button class="btn red" data-a="fix">✔ إصلاح كل الأعطال</button></div>
    ${FLT.map(([k,n,h])=>`<label class="flt${F(k)&&S.hid!==k?' on':''}"><input type="checkbox" data-f="${k}" ${F(k)&&S.hid!==k?'checked':''}><span><b>${n}</b><small>العَرَض: ${h}</small></span></label>`).join('')}`;}}
const FLT=[
 ['ol','الحماية الحرارية F2 فصلت (حمل زائد على المحرك)','الخط لا يعمل ولا يمسك، واللمبة الحمراء H2 مضيئة.'],
 ['hold','تلامس المسك الذاتي K1 (13-14) لا يغلق','الخط يعمل فقط ما دام S1 مضغوطًا، ويقف عند رفع الإصبع.'],
 ['q1','خرج PLC Q1 تالف (لا يغلق تلامسه)','شاشة easy تظهر Q1 يعمل لكن K2 لا يجذب والسير واقف.'],
 ['b1','الحساس B1 عند المكبس معطل','القطع تمر دون ختم وتصل إلى النهاية غير مختومة.'],
 ['lim','مفتاح نهاية المشوار 1B2 لا يعمل','المكبس ينزل ويبقى تحت، والخط متوقف (T1 لا يبدأ).'],
 ['cam','الكاميرا B3 ترى كل القطع معيبة','كل القطع تُطرد حتى السليمة.'],
 ['coil','ملف الصمام 2Y1 محروق','السير يقف عند القطعة المعيبة ثم يكملها إلى صندوق السليمة دون طرد.'],
 ['air','ضغط الهواء منخفض (2 bar)','حركة المكبس والذراع بطيئة، وزمن الدورة يطول، والذراع لا يكمل الطرد قبل انتهاء T2 فتمر بعض المعيبة.']];
function editor(){const opt=(v,arr)=>arr.map(a=>`<option value="${a}"${a===v?' selected':''}>${a}${IOC[a]?' · '+IOC[a]:''}</option>`).join('');
  const ce=(e,ri,ei,bi)=>`<span class="el"><select data-k="a" data-r="${ri}" data-e="${ei}" data-b="${bi}">${opt(e.a,OPS)}</select><select data-k="n" data-r="${ri}" data-e="${ei}" data-b="${bi}"><option value="0"${e.n?'':' selected'}>⊣ ⊢ مفتوح NO</option><option value="1"${e.n?' selected':''}>⊣/⊢ مغلق NC</option></select><span><button class="x" data-a="dc" data-r="${ri}" data-e="${ei}" data-b="${bi}" title="حذف التلامس">✕</button><button class="btn" data-a="or" data-r="${ri}" data-e="${ei}" title="إضافة تلامس بالتوازي (أو)">+ أو</button></span></span>`;
  return `<div class="row" dir="rtl"><b>تعديل البرنامج</b><button class="btn pri" data-a="done">✔ حفظ وتشغيل</button><button class="btn" data-a="add">+ سطر جديد</button><button class="btn red" data-a="def">↺ البرنامج الأصلي</button></div>
  <p class="note" dir="rtl">كل سطر: تلامسات على التوالي (و) ثم ملف. «+ أو» يضيف تلامسًا بالتوازي. الملف: = عادي، S ضبط، R مسح، TT مؤقت تأخير تشغيل، CC عداد، RC تصفير العداد.</p>`+
  S.prog.map((r,ri)=>`<div class="ed"><span class="n">${ri+1}</span>${r.s.map((e,ei)=>e.par?`<span class="el" style="border-style:solid">${e.par.map((b,bi)=>ce(b[0],ri,ei,bi)).join('<small style="text-align:center">أو</small>')}</span>`:ce(e,ri,ei,-1)).join(' ')}
    <button class="btn" data-a="ac" data-r="${ri}" title="إضافة تلامس">+ تلامس</button> → <select data-k="t" data-r="${ri}">${['=','S','R','TT','CC','RC'].map(t=>`<option${t===r.t?' selected':''}>${t}</option>`).join('')}</select><select data-k="o" data-r="${ri}">${opt(r.o,r.t==='TT'?['T1','T2','T3']:/C/.test(r.t)?['C1','C2']:['Q1','Q2','Q3','Q4','M1','M2','M3','M4'])}</select>
    ${r.t==='TT'||r.t==='CC'?`<input data-k="p" data-r="${ri}" type="number" step="${r.t==='TT'?.1:1}" min="0.1" value="${r.p}" style="width:64px" title="${r.t==='TT'?'الزمن بالثواني':'القيمة'}">`:''}
    <button class="x" data-a="up" data-r="${ri}" title="أعلى">▲</button><button class="x" data-a="dr" data-r="${ri}" title="حذف السطر">🗑</button>
    <input data-k="r" data-r="${ri}" value="${esc(r.r||'')}" placeholder="ملاحظة" style="width:100%;margin-top:4px" dir="rtl"></div>`).join('');}
function getE(r,e,b){const el=S.prog[r].s[e];return b>=0?el.par[b][0]:el;}
$('panel').addEventListener('change',e=>{const t=e.target,k=t.dataset.k;if(!k)return;const r=+t.dataset.r,P=S.prog[r];
  if(k==='a'||k==='n'){const el=getE(r,+t.dataset.e,+t.dataset.b);if(k==='a')el.a=t.value;else el.n=t.value==='1';}
  else if(k==='t'){P.t=t.value;if(P.t==='TT'){P.o=/^T/.test(P.o)?P.o:'T1';P.p=P.p||1;}else if(/C/.test(P.t)){P.o=/^C/.test(P.o)?P.o:'C1';P.p=P.p||10;}else if(!/^[QM]/.test(P.o))P.o='M1';panel(true);}
  else if(k==='o')P.o=t.value;else if(k==='p')P.p=Math.max(.1,+t.value||1);else if(k==='r')P.r=t.value;});
$('panel').addEventListener('click',e=>{const b=e.target.closest('[data-a]');const fl=e.target.closest('[data-f]');
  if(fl){const k=fl.dataset.f;if(fl.checked)S.flt.add(k);else S.flt.delete(k);say(fl.checked?'أُدخل عطل: '+FLT.find(f=>f[0]===k)[1]:'أُصلح العطل');panel(true);return;}
  if(!b)return;const a=b.dataset.a,r=+b.dataset.r,P=S.prog[r];
  if(a==='edit'){EDIT=true;panel(true);return;}
  if(a==='run'){S.run=!S.run;plcReset();say(S.run?'PLC: RUN':'PLC: STOP');panel(true);return;}
  if(a==='done'){EDIT=false;S.prog.forEach(q=>q.s=q.s.filter(Boolean));S.prog=S.prog.filter(q=>q.s.length);ls('lnProg',JSON.stringify(S.prog.map(({_v,...q})=>q)));plcReset();say('حُفظ البرنامج ونُقل إلى الجهاز');panel(true);return;}
  if(a==='def'){if(!confirm('استعادة البرنامج الأصلي؟ ستضيع تعديلاتك.'))return;S.prog=clone(PROG0);ls('lnProg',JSON.stringify(S.prog));plcReset();panel(true);return;}
  if(a==='add'){S.prog.push({s:[c_('I1')],t:'=',o:'M4',r:''});panel(true);return;}
  if(a==='ac'){P.s.push(c_('I1'));panel(true);return;}
  if(a==='dr'){S.prog.splice(r,1);panel(true);return;}
  if(a==='up'){if(r>0){[S.prog[r-1],S.prog[r]]=[S.prog[r],S.prog[r-1]];}panel(true);return;}
  if(a==='or'){const i=+b.dataset.e,el=P.s[i];if(el.par)el.par.push([c_('I1')]);else P.s[i]={par:[[el],[c_('I1')]]};panel(true);return;}
  if(a==='dc'){const i=+b.dataset.e,bi=+b.dataset.b;const el=P.s[i];if(bi>=0){el.par.splice(bi,1);if(el.par.length===1)P.s[i]=el.par[0][0];}else P.s.splice(i,1);panel(true);return;}
  if(a==='hid'){[...S.flt].forEach(k=>{if(k===S.hid)S.flt.delete(k);});const k=FLT[Math.floor(Math.random()*FLT.length)][0];S.hid=k;S.flt.add(k);say('🎲 أُدخل عطل مخفي: اطلب من المتدربين تحديده');panel(true);return;}
  if(a==='show'){if(S.hid)alert('العطل المخفي: '+FLT.find(f=>f[0]===S.hid)[1]);return;}
  if(a==='fix'){S.flt.clear();S.hid=null;say('أُصلحت كل الأعطال');panel(true);}});
$('tabs').addEventListener('click',e=>{const t=e.target.closest('[data-t]');if(!t)return;TAB=t.dataset.t;ls('lnTab',TAB);EDIT=false;tabsUI();panel(true);});
function tabsUI(){document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.t===TAB)));}

/* ---------- operator buttons ---------- */
document.querySelectorAll('[data-p]').forEach(b=>{const k=b.dataset.p,dn=e=>{e.preventDefault();S.pr.add(k);b.classList.add('down');},up=()=>{S.pr.delete(k);b.classList.remove('down');};
  b.addEventListener('pointerdown',dn);['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,up));b.addEventListener('contextmenu',e=>e.preventDefault());});
$('oQ0').onclick=()=>{S.Q0=!S.Q0;if(!S.Q0){S.K1=false;plcReset();}say(S.Q0?'Q0: وُصلت الكهرباء':'Q0: فُصلت الكهرباء');};
$('oS9').onclick=()=>{S.S9=!S.S9;say(S.S9?'🛑 طوارئ: توقف كل شيء. اضغط مرة أخرى لفك زر الطوارئ':'فُك زر الطوارئ: شغّل الخط بـ S1');};
$('oRun').onclick=()=>{S.run=!S.run;plcReset();say(S.run?'PLC: RUN':'PLC: STOP');panel(true);};
let msgT=0;function say(m,err){const el=$('msg');el.textContent=m;el.hidden=false;el.classList.toggle('err',!!err);clearTimeout(msgT);msgT=setTimeout(()=>el.hidden=true,4000);}
function opsUI(){$('oQ0').classList.toggle('on',S.Q0);$('oS9').classList.toggle('down',S.S9);$('oRun').classList.toggle('on',S.run);
  $('H1').style.background=S.K1?'#2aa84a':'#3a3f44';$('H2').style.background=F('ol')||S.S9?'#d8322b':'#3a3f44';$('H3').style.background=S.Q.Q4?'#ffb300':'#3a3f44';
  $('stats').innerHTML=`<span>سليمة: <b class="good">${S.good}</b></span><span>مطرودة: <b>${S.rej}</b></span><span>أخطاء جودة: <b class="bad">${S.err}</b></span><span>الدفعة C1: <b>${S.C.C1?S.C.C1.cnt:0}/${S.C.C1?S.C.C1.pre:10}</b></span><span>السير: <b>${S.K2?'يتحرك':'واقف'}</b></span>`;}

/* ---------- loop ---------- */
let lt=performance.now(),n=0;
function loop(){const now=performance.now(),dt=Math.min(.1,(now-lt)/1000);lt=now;step(dt);scene();opsUI();if(++n%4===0)panel(false);}
setInterval(loop,40);
tabsUI();panel(true);
window.__ln={S,step,PROG0};
})();
</script>
<style>#ptr{position:fixed;top:-46px;left:50%;transform:translateX(-50%);width:40px;height:40px;border-radius:50%;background:#fff;color:#0b3d91;box-shadow:0 3px 12px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;z-index:9999;opacity:0;transition:opacity .15s,background .15s;pointer-events:none}#ptr.on{opacity:1}#ptr.go{background:#0b3d91;color:#fff}</style>
<script>
/* pull down from the top of the page to reload: inside the main site this page sits in a frame, which the browser's own pull-to-refresh never reaches */
(function(){var y0=null,ind=document.createElement('div');ind.id='ptr';ind.setAttribute('aria-hidden','true');ind.textContent='↻';document.body.appendChild(ind);
var atTop=function(){return (document.scrollingElement||document.documentElement).scrollTop<=0;},reset=function(){ind.classList.remove('on','go');ind.style.transform='translateX(-50%)';};
addEventListener('touchstart',function(e){y0=null;if(e.touches.length!==1||!atTop()||e.target.closest('svg,.ops,.panel,select,input,textarea'))return;y0=e.touches[0].clientY;},{passive:true});
addEventListener('touchmove',function(e){if(y0==null)return;var dy=e.touches[0].clientY-y0;if(e.touches.length!==1||dy<=0||!atTop()){reset();if(dy<0)y0=null;return;}var d=Math.min(120,dy*.5);ind.style.transform='translate(-50%,'+(d+8)+'px) rotate('+(d*3)+'deg)';ind.classList.add('on');ind.classList.toggle('go',d>=70);},{passive:true});
var end=function(){if(y0==null)return;var go=ind.classList.contains('go');y0=null;reset();if(go){ind.classList.add('on','go');try{(window.parent&&window.parent!==window?window.parent:window).location.reload();}catch(_){location.reload();}}};
addEventListener('touchend',end,{passive:true});addEventListener('touchcancel',function(){y0=null;reset();},{passive:true});})();
</script>
