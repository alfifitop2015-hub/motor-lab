<style>
:root{--bg:#e6ebf0;--ink:#15202b;--muted:#586675;--panel:#fff;--line:#c8d2dc;--accent:#1f5fbf;--warn:#c42b22;--ok:#1a8a42;--chip:#eef2f6;--s7:#009999;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;font-size:15px;line-height:1.5}
button,select,input{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}

.ib{min-width:40px;height:38px;border:1px solid var(--line);background:var(--panel);border-radius:9px;font-size:.92rem;font-weight:700;cursor:pointer;flex:none;padding:0 10px}

.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.s7{background:var(--s7);color:#fff;border-color:var(--s7)}.btn.red{color:var(--warn)}
.btn:disabled{opacity:.45}

<div class="top">

  <div class="note" style="margin:0 10px" id="wHint">اضغط طرفًا ثم طرفًا آخر لتمديد سلك. اضغط سلكًا لتحديده وحذفه. لون السلك يتحدد تلقائيًا: أحمر L+، أزرق M، بنفسجي إشارة، وبني/أسود/رمادي للأطوار.</div>

</div>

  <div class="row"><button class="btn s7" id="pDl" title="تحميل البرنامج من المحرر إلى الجهاز">⤓ تحميل إلى PLC</button><button class="btn" id="pRun">RUN / STOP</button><button class="btn" id="pMon">👓 مراقبة</button><button class="btn" id="pAdd">＋ شبكة</button><button class="btn" id="pStl">STL</button><button class="btn red" id="pClr">مسح البرنامج</button><button class="btn trainer" id="pSol">البرنامج النموذجي</button></div>

<div class="pane" id="p-ex"><div class="doc" id="exDoc"></div></div>
<script>
(function(){
/* ===================== data: I/O, devices, exercises ===================== */
const IN=[['S1','تشغيل الخط','NO'],['S0','إيقاف الخط','NC'],['B1','قطعة تحت المكبس','PNP'],['1B1','المكبس فوق','PNP'],['1B2','المكبس تحت','PNP'],
  ['B2','قطعة معيبة عند الطرد','PNP'],['B3','صندوق تحت المزلق','PNP'],['B4','قطعة تسقط في الصندوق','PNP'],['B5','صندوق عند التعبئة','PNP'],
  ['SQ1','المصعد تحت','LS'],['SQ2','المصعد فوق','LS'],['S2','تشغيل الخلاط','NO'],['F','الأوفرلودات (NC على التوالي)','OL'],['S3','إيقاف الخلاط','NC']];
const OUT=[['K1','محرك السير M1'],['Y1','إنزال المكبس 1A'],['Y2','بوابة الطرد 2A'],['K2','سير الصناديق M2'],['Y3','صمام التعبئة'],
  ['K3','المصعد صعود M4'],['K4','المصعد نزول M4'],['KM','الخلاط: الرئيسي'],['KY','الخلاط: نجمة'],['KD','الخلاط: دلتا']];
const IA=i=>'I'+(i>>3)+'.'+(i&7),QA=i=>'Q'+(i>>3)+'.'+(i&7);
const INI={},OUTI={};IN.forEach((d,i)=>INI[d[0]]=i);OUT.forEach((d,i)=>OUTI[d[0]]=i);
/* motors: contactors, overload, kind */
const MOT={M1:{k:['K1'],f:'F1',n:'محرك السير الناقل',kind:'dol'},M2:{k:['K2'],f:'F2',n:'محرك سير الصناديق',kind:'dol'},
  M3:{k:['KM','KY','KD'],f:'F3',n:'محرك الخلاط (نجمة/دلتا)',kind:'yd'},M4:{k:['K3','K4'],f:'F4',n:'محرك المصعد (عكس حركة)',kind:'rev'}};
/* ---- the exercises ---- */
const EXS=[
 {id:'e1',n:'1. تشغيل السير الناقل مع تثبيت ذاتي',in:['S1','S0','F'],out:['K1'],mot:['M1'],plant:{belt:1},
  d:'S1 يشغّل محرك السير M1 ويبقى يعمل بعد رفع الإصبع، وS0 (مغلق NC) يوقفه، وفصل الأوفرلود F1 يوقفه أيضًا. القطع تنزل آليًا على السير وتسقط في الحاوية آخره.',
  goals:['run','stop','ol','deliver5']},
 {id:'e2',n:'2. تشغيل سيرين بالتتابع',in:['S1','S0','F'],out:['K1','K2'],mot:['M1','M2'],plant:{belt:1,boxes:1,boxFree:1},
  d:'عند S1 يعمل سير الصناديق M2 أولًا، وبعد 3 ثوانٍ يعمل السير الناقل M1، حتى لا تسقط القطع على سير متوقف. عند S0 يقف M1 فورًا ويستمر M2 ثلاث ثوانٍ ليفرغ ثم يقف. الأوفرلود يوقف الاثنين فورًا.',
  goals:['seqStart','seqStop','ol']},
 {id:'e3',n:'3. تشغيل الخلاط نجمة/دلتا',in:['S2','S3','F'],out:['KM','KY','KD'],mot:['M3'],plant:{mixer:1},
  d:'S2 يشغّل محرك الخلاط M3 نجمة (KM + KY) لتخفيف تيار البدء، وبعد 5 ثوانٍ يتحول إلى دلتا (KM + KD). لا يعمل KY وKD معًا أبدًا (قصر بين الأطوار). S3 والأوفرلود يوقفانه.',
  goals:['star','delta','mixStop','ol']},
 {id:'e4',n:'4. مكبس الختم الهوائي',in:['S1','S0','B1','1B1','1B2','F'],out:['K1','Y1'],mot:['M1'],plant:{belt:1,press:1},
  d:'السير يحمل القطع. عندما يكشف B1 قطعة تحت المكبس يقف السير، وينزل المكبس 1A (الصمام Y1) حتى 1B2، ويضغط نصف ثانية، ثم يرتفع حتى 1B1، ثم يعود السير. إذا تحرك السير والمكبس نازل تنحشر القطعة.',
  goals:['run','stamp5','nojam']},
 {id:'e5',n:'5. فحص القطع وطرد المعيبة',in:['S1','S0','B2','F'],out:['K1','Y2'],mot:['M1'],plant:{belt:1,sort:1},
  d:'الحساس اللوني B2 يكشف القطعة المعيبة (الحمراء). عندها تُفتح بوابة الطرد بالأسطوانة 2A (Y2) لمدة 0.8 ثانية فتسقط القطعة المعيبة في صندوق المرفوضات، وتمر السليمة.',
  goals:['run','reject3','nogoodrej']},
 {id:'e6',n:'6. العد والتعبئة في الصناديق',in:['S1','S0','B3','B4','B5','F'],out:['K1','K2','Y3'],mot:['M1','M2'],plant:{belt:1,boxes:1},
  d:'كل صندوق تحت المزلق (B3) يأخذ 5 قطع يعدّها B4. عند اكتمال العدد يقف السير M1 ويتحرك سير الصناديق M2 حتى يصل الصندوق إلى التعبئة (B5)، فيفتح صمام التعبئة Y3 أربع ثوانٍ. السير M1 لا يعمل إلا وصندوق فارغ تحته.',
  goals:['box2','fill2','nospill']},
 {id:'e7',n:'7. مصعد الصناديق (عكس حركة)',in:['S1','S0','SQ1','SQ2','F'],out:['K3','K4'],mot:['M4'],plant:{lift:1,liftSelf:1},
  d:'S1 يرفع المصعد بمحرك M4 (K3) حتى نهاية المشوار العلوية SQ2، فيُدفع الصندوق إلى الرف، ثم بعد ثانيتين ينزل (K4) حتى SQ1. لا يعمل K3 وK4 معًا أبدًا، وS0 يوقف الحركة.',
  goals:['lift2','nocrash']},
 {id:'e8',n:'8. الخط الكامل',in:IN.map(d=>d[0]),out:OUT.map(d=>d[0]),mot:['M1','M2','M3','M4'],plant:{mixer:1,belt:1,press:1,sort:1,boxes:1,lift:1},
  d:'كل المراحل معًا: الخلاط يعمل نجمة/دلتا ويغذي السير بالقطع، المكبس يختم كل قطعة، بوابة الطرد تُسقط المعيبة، القطع السليمة تُعدّ 5 في كل صندوق، الصندوق يُعبأ ثم يُنقل إلى المصعد الذي يرفعه إلى الرف ويعود.',
  goals:['delta','stamp5','reject3','fill2','store2','nojam','nospill']}];
const GOALS={run:'S1 يشغّل M1 ويبقى يعمل بعد رفع الإصبع',stop:'S0 يوقف M1',ol:'فصل الأوفرلود يوقف المحرك (جرّب زر «اختبار الأوفرلود»)',deliver5:'وصلت 5 قطع إلى آخر السير',
  seqStart:'M2 يبدأ قبل M1 بثلاث ثوانٍ تقريبًا',seqStop:'عند S0 يقف M1 أولًا ثم M2 بعده بثلاث ثوانٍ تقريبًا',star:'الخلاط بدأ نجمة',delta:'الخلاط تحول إلى دلتا بعد زمن النجمة',mixStop:'S3 يوقف الخلاط',
  stamp5:'خُتمت 5 قطع',nojam:'لم تنحشر أي قطعة تحت المكبس',reject3:'طُردت 3 قطع معيبة',nogoodrej:'لم تُطرد أي قطعة سليمة',box2:'امتلأ صندوقان بخمس قطع',fill2:'عُبئ صندوقان',
  nospill:'لا قطع خارج الصندوق ولا انسكاب',lift2:'أكمل المصعد دورتين (صعود ونزول)',nocrash:'لم يصطدم المصعد بنهاية المشوار',store2:'وصل صندوقان إلى الرف'};

/* ===================== devices & terminals of the wiring board ===================== */
/* each device: id, type, terminals; the PLC is one device with DI, DQ, supply terminals */
function devList(ex){const L=[{id:'SUP',t:'sup'},{id:'PS',t:'ps'},{id:'PLC',t:'plc'}];
  ex.in.forEach(n=>{const k=IN[INI[n]][2];if(k==='OL')return;L.push({id:n,t:k==='NO'?'pbno':k==='NC'?'pbnc':k==='LS'?'ls':'pnp'});});
  ex.mot.forEach(m=>{const M=MOT[m];M.k.forEach(k=>L.push({id:k,t:'k'}));L.push({id:M.f,t:'ol'});L.push({id:m,t:'mot'});});
  ex.out.forEach(n=>{if(n[0]==='Y')L.push({id:n,t:'sol'});});return L;}
const TERM={sup:['L1','L2','L3'],ps:['L+','L+2','M','M2'],pbno:['13','14'],pbnc:['11','12'],ls:['13','14'],pnp:['BN','BK','BU'],
  k:['A1','A2','1','2','3','4','5','6'],ol:['1','2','3','4','5','6','95','96'],mot:['U1','V1','W1','W2','U2','V2'],sol:['A1','A2']};
function plcTerms(){const t=['L+','M','DIM','DOL','DOM'];IN.forEach((d,i)=>t.push('I'+i));OUT.forEach((d,i)=>t.push('Q'+i));return t;}
function allTerms(ex){const T=[];devList(ex).forEach(d=>{(d.t==='plc'?plcTerms():TERM[d.t]).forEach(n=>T.push(d.id+'.'+n));});return T;}
const isAC=k=>{const [d,n]=k.split('.');return d==='SUP'||/^M\d$/.test(d)||(/^(K\d|KM|KY|KD|F\d)$/.test(d)&&/^[1-6]$/.test(n));};

/* the reference wiring of an exercise, as nets (each array must end up connected, and different arrays must stay apart) */
function solNets(ex){const D=devList(ex),has=id=>D.some(d=>d.id===id),N=[];const LP=['PS.L+','PLC.L+','PLC.DOL'],MM=['PS.M','PLC.M','PLC.DIM','PLC.DOM'];
  ex.in.forEach(n=>{const i=INI[n],k=IN[i][2];
    if(k==='NO'||k==='LS'){LP.push(n+'.13');N.push([n+'.14','PLC.I'+i]);}
    else if(k==='NC'){LP.push(n+'.11');N.push([n+'.12','PLC.I'+i]);}
    else if(k==='PNP'){LP.push(n+'.BN');MM.push(n+'.BU');N.push([n+'.BK','PLC.I'+i]);}
    else if(k==='OL'){const fs=ex.mot.map(m=>MOT[m].f);LP.push(fs[0]+'.95');for(let j=0;j<fs.length-1;j++)N.push([fs[j]+'.96',fs[j+1]+'.95']);N.push([fs[fs.length-1]+'.96','PLC.I'+i]);}});
  ex.out.forEach(n=>{const i=OUTI[n];N.push(['PLC.Q'+i,n+'.A1']);MM.push(n+'.A2');});
  N.push(LP,MM);
  /* power: L1 L2 L3 nets */
  const P={L1:['SUP.L1'],L2:['SUP.L2'],L3:['SUP.L3']};
  ex.mot.forEach(m=>{const M=MOT[m],f=M.f;

  IN.forEach((d,i)=>{R.I[i]=R.plcPw&&dimOk&&u.f('PLC.I'+i)===LP&&!R.dcShort;});
  D.forEach(d=>{if(d.t==='k'||d.t==='sol')R.coil[d.id]=!R.dcShort&&u.f(d.id+'.A1')===LP&&u.f(d.id+'.A2')===M;});

    D.forEach(d=>{const p=n=>d.id+'.'+n;if(d.t==='k'&&kOn[d.id]){v.u(p('1'),p('2'));v.u(p('3'),p('4'));v.u(p('5'),p('6'));}if(d.t==='ol'){v.u(p('1'),p('2'));v.u(p('3'),p('4'));v.u(p('5'),p('6'));}});

  for(let c=0;c<NC;c++){for(let r=0;r<R;r++){const e=N.rows[r][c];let pass=false;
      if(e){const b=bitOf(P,e.a,model);

$('pDl').onclick=()=>{const errs=progCheck(EP);if(errs.length){say(errs[0],1);return;}L.prog=clone(EP);L.P=plcNew();say('حُمّل البرنامج إلى '+(MODEL==='300'?'CPU 314':'CPU 1214C')+' ('+EP.length+' Network). الجهاز على '+(L.plcRun?'RUN':'STOP'));renderProg();};
$('pRun').onclick=()=>{L.plcRun=!L.plcRun;say(L.plcRun?'PLC على RUN':'PLC على STOP');renderProg();};
$('pMon').onclick=()=>{MON=!MON;renderProg();};$('pStl').onclick=()=>{STL=!STL;renderProg();};
$('pClr').onclick=()=>{if(!confirm('مسح كل شبكات البرنامج في هذا التمرين؟'))return;EP=[newNet()];SEL=null;saveP();renderProg();};
$('pSol').onclick=()=>{if(!confirm('استبدال برنامجك بالبرنامج النموذجي لهذا التمرين؟'))return;EP=SOL[EX.id]();SEL=null;saveP();renderProg();say('حُمّل البرنامج النموذجي في المحرر: اضغط «⤓ تحميل إلى PLC»');};
function progCheck(P){const e=[];P.forEach((N,ni)=>{N.rows.forEach((row,r)=>row.forEach(c=>{if(c&&c.t!=='W'&&!c.a)e.push(`Network ${ni+1}: تلامس بلا عنوان`);}));N.out.forEach(o=>{if(o&&!o.a)e.push(`Network ${ni+1}: مخرج بلا عنوان`);});});
  /* a coil written in two places */
  const seen={};P.forEach((N,ni)=>N.out.forEach(o=>{if(o&&o.t==='='&&o.a){if(seen[o.a]!=null&&seen[o.a]!==ni)e.push(`تحذير: الملف ${dispA(o.a)} مكتوب في Network ${seen[o.a]+1} وNetwork ${ni+1}، والأخير هو الذي يُطبق`);seen[o.a]=ni;}}));
  return e.filter(x=>!x.startsWith('تحذير'));}
/* ---------- STL of the program (S7-300) ---------- */
function stlOf(P){let out='';let fp=0;
  P.forEach((N,ni)=>{out+=`// Network ${ni+1}: ${N.c||''}\n`;const R=N.rows.length;
    let val=Array.from({length:R},()=>Array(NC+1).fill(null));for(let r=0;r<R;r++)val[r][0]={k:'T'};
    const and=(a,b)=>{if(!a||!b)return null;if(a.k==='T')return b;if(b.k==='T')return a;return{k:'and',x:[...(a.k==='and'?a.x:[a]),...(b.k==='and'?b.x:[b])]};};
    const or=xs=>{xs=xs.filter(Boolean);if(!xs.length)return null;if(xs.some(x=>x.k==='T'))return{k:'T'};const u=[];xs.forEach(x=>{const s=JSON.stringify(x);if(!u.some(y=>JSON.stringify(y)===s))u.push(x);});return u.length===1?u[0]:{k:'or',x:u.flatMap(x=>x.k==='or'?x.x:[x])};};
    for(let c=0;c<NC;c++){for(let r=0;r<R;r++){const e=N.rows[r][c];const v=val[r][c];val[r][c+1]=!e||!v?null:e.t==='W'?v:and(v,{k:'leaf',e});}
      for(let r=0;r<R-1;r++)if(N.lk[r][c+1]){let r2=r;while(r2<R-1&&N.lk[r2][c+1])r2++;const o=or(val.slice(r,r2+1).map(x=>x[c+1]));for(let q=r;q<=r2;q++)val[q][c+1]=o;r=r2;}}
    const leaf=(e,op)=>{const a=dispA(e.a);if(e.t==='NO')return `${op} ${a}\n`;if(e.t==='NC')return `${op}N ${a}\n`;if(e.t==='P'||e.t==='N')return `${op}(\n  A ${a}\n  F${e.t} M100.${fp++%8}\n)\n`;if(e.t==='GE')return `${op}(\n  L ${a}\n  L ${e.n}\n  >=I\n)\n`;return '';};
    const emit=(x,op)=>{if(x.k==='T')return '';if(x.k==='leaf')return leaf(x.e,op);if(x.k==='and'){return x.x.map(k=>k.k==='or'?`${op}(\n${emitOr(k).replace(/^/gm,'  ')})\n`:emit(k,op)).join('');}return `${op}(\n${emitOr(x).replace(/^/gm,'  ')})\n`;};
    const emitOr=x=>x.x.map((k,i)=>k.k==='leaf'?leaf(k.e,'O'):k.k==='and'?(i?'O\n':'')+emit(k,'A'):emit(k,'O')).join('');
    N.out.forEach((o,r)=>{if(!o||!o.a)return;const x=val[r][NC];let s=x?(x.k==='or'?emitOr(x):emit(x,'A')):'CLR\n';if(x&&x.k==='T')s='SET\n';
      const a=dispA(o.a);if(o.t==='=')s+=`=  ${a}\n`;else if(o.t==='S')s+=`S  ${a}\n`;else if(o.t==='R')s+=`R  ${a}\n`;
      else if(o.t==='TON')s+=`L  ${tFmt(o.v)}\nSD ${a}\n`;else if(o.t==='TOF')s+=`L  ${tFmt(o.v)}\nSF ${a}\n`;else if(o.t==='CU')s+=`CU ${a}\n`+(o.r?`A  ${dispA(o.r)}\nR  ${a}\n`:'');
      out+=s;});out+='\n';});return out;}
/* ===================== the exercise sheet ===================== */
function renderDoc(){if(!L)return;const ex=EX;let h=`<h3>${esc(ex.n)}</h3><p>${esc(ex.d)}</p>`;
  h+=`<div class="note">الجهاز المختار: <b>${MODEL==='300'?'SIMATIC S7-300 (CPU 314 + SM321 DI16 + SM322 DO16) · Step 7 الكلاسيكي':'SIMATIC S7-1200 (CPU 1214C DC/DC/DC) · TIA Portal'}</b>. يمكنك التبديل بين الجهازين من الأعلى، والبرنامج يتحول تلقائيًا إلى عناوين الجهاز الآخر.</div>`;
  h+=`<h3>جدول الرموز (المداخل والمخارج)</h3><table class="io"><tr><th>العنوان</th><th>الرمز</th><th>الوصف</th><th>النوع</th></tr>`;
  ex.in.forEach(n=>{const i=INI[n],d=IN[i];h+=`<tr><td class="a">${esc(dispA(IA(i)))}</td><td><b>${d[0]}</b></td><td>${esc(d[1])}</td><td>${{NO:'ضاغط مفتوح NO',NC:'ضاغط مغلق NC',PNP:'حساس PNP ثلاثي الأسلاك',LS:'نهاية مشوار NO',OL:'تلامسات 95-96 للأوفرلودات'}[d[2]]}</td></tr>`;});
  ex.out.forEach(n=>{const i=OUTI[n],d=OUT[i];h+=`<tr><td class="a">${esc(dispA(QA(i)))}</td><td><b>${d[0]}</b></td><td>${esc(d[1])}</td><td>${d[0][0]==='Y'?'ملف صمام هوائي 24V':'ملف كونتاكتور 24V'}</td></tr>`;});h+='</table>';
  h+=`<h3>خطوات التمرين</h3><ol>
    <li><b>التوصيل 🔌:</b> وصّل مصدر 24V بالجهاز (L+ وM)، و1M للمداخل، و${MODEL==='300'?'2L+ و2M':'3L+ و3M'} للمخارج. ثم وصّل كل ضاغط وحساس إلى مدخله، وكل مخرج إلى ملف الكونتاكتور أو الصمام (A1)، وA2 إلى M.</li>
    <li><b>دائرة القوى:</b> من الأطوار L1 L2 L3 إلى الكونتاكتور (1-3-5)، ومن (2-4-6) إلى الأوفرلود، ثم إلى أطراف المحرك U1 V1 W1. محرك التشغيل المباشر يُوصل نجمة بقنطرة بين U2 V2 W2.${ex.mot.includes('M3')?' محرك النجمة/دلتا: KD يربط U1-W2 وV1-U2 وW1-V2، وKY يقصر U2 V2 W2 معًا.':''}${ex.mot.includes('M4')?' عكس الحركة: K4 يبدّل الطورين L1 وL3.':''}</li>
    <li><b>تلامسات الأوفرلود 95-96</b> توصل على التوالي من L+ إلى مدخل F، فيصبح المدخل 0 عند أي فصل.</li>
    <li>اضغط <b>✔ فحص التوصيل</b> لمعرفة الناقص والخطأ.</li>
    <li><b>البرنامج 🧠:</b> اكتب الشبكات بالسلم LAD، ثم <b>⤓ تحميل إلى PLC</b> وتأكد أن الجهاز على RUN.</li>
    <li><b>التشغيل 🏭:</b> شغّل الخط بالضواغط وتابع المطالب حتى تكتمل كلها ✅.</li></ol>`;
  h+=`<h3>المطلوب</h3><ul>${ex.goals.map(k=>`<li>${esc(GOALS[k])}</li>`).join('')}</ul>`;
  h+=`<h3>تذكير بتعليمات Step 7 في هذا المحاكي</h3><table class="io"><tr><th>الرمز</th><th>المعنى</th></tr>
    <tr><td class="a">─| |─</td><td>تلامس مفتوح: يمرر عندما يكون العنوان 1</td></tr><tr><td class="a">─|/|─</td><td>تلامس مغلق: يمرر عندما يكون العنوان 0 (ضاغط NC موصول بمدخل يعطي 1 وهو غير مضغوط، فيُكتب في البرنامج تلامسًا مفتوحًا)</td></tr>
    <tr><td class="a">─|P|─ / ─|N|─</td><td>نبضة عند صعود الإشارة / عند هبوطها (لدورة واحدة)</td></tr><tr><td class="a">( ) (S) (R)</td><td>ملف، ضبط (يبقى 1)، إعادة ضبط</td></tr>
    <tr><td class="a">${BOXN.TON[MODEL]}</td><td>مؤقت تأخير تشغيل: ${MODEL==='300'?'TV = S5T#5S، وتلامسه T1':'PT = T#5s، وتلامسه "T1".Q'}</td></tr><tr><td class="a">${BOXN.TOF[MODEL]}</td><td>مؤقت تأخير فصل: مخرجه يبقى 1 مدة الزمن بعد زوال الدخل</td></tr>
    <tr><td class="a">${BOXN.CU[MODEL]}</td><td>عداد تصاعدي: يزيد 1 مع كل صعود للدخل، ودخل R يصفّره. ${MODEL==='300'?'تلامس C1 يكون 1 إذا كانت القيمة أكبر من صفر':'"C1".Q يكون 1 إذا وصلت القيمة إلى PV'}</td></tr>
    <tr><td class="a">CMP>=I</td><td>مقارنة: يمرر إذا كانت قيمة العداد أكبر من الرقم أو تساويه</td></tr></table>`;
  if(TRAINER)h+=`<div class="note">للمدرب: زر «توصيل نموذجي» في التوصيل، و«البرنامج النموذجي» في البرنامج، يحمّلان الحل الكامل لهذا التمرين.</div>`;
  h+=`<div class="row" style="padding:6px 0"><button class="btn red" id="exReset">بدء التمرين من جديد (مسح التوصيل والبرنامج)</button></div>`;
  $('exDoc').innerHTML=h;$('exReset').onclick=()=>{if(!confirm('مسح توصيلك وبرنامجك في هذا التمرين؟'))return;ls(keyW(),null);ls(keyP(),null);loadEx();};}
loadEx();
})();
</script>
