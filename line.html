<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title>خط الإنتاج المتكامل · PLC Step 7</title>
<style>
:root{--bg:#e6ebf0;--ink:#15202b;--muted:#586675;--panel:#fff;--line:#c8d2dc;--accent:#1f5fbf;--warn:#c42b22;--ok:#1a8a42;--chip:#eef2f6;--s7:#009999;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;font-size:15px;line-height:1.5}
button,select,input{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar1{display:flex;align-items:center;gap:8px;padding:8px 10px 4px}
.bar1 h1{flex:1;font-size:1rem;line-height:1.3;margin:0}
.bar1 h1 .credit{display:block;font-size:.72rem;font-weight:500;color:var(--muted)}
.ib.new{background:#1a8a42;color:#fff;border-color:#1a8a42;animation:pulse 1.4s infinite}@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(26,138,66,.25)}}
.ib{min-width:40px;height:38px;border:1px solid var(--line);background:var(--panel);border-radius:9px;font-size:.92rem;font-weight:700;cursor:pointer;flex:none;padding:0 10px}
.bar2{display:flex;gap:6px;align-items:center;padding:2px 10px 6px;flex-wrap:wrap}
.bar2 select{height:36px;border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:0 6px;max-width:100%;flex:1 1 220px}
.mdl{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.mdl button{border:0;background:var(--panel);padding:0 10px;height:34px;cursor:pointer;font-weight:700;font-size:.85rem}
.mdl button.on{background:var(--s7);color:#fff}.mdl button{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;height:40px!important}.mdl small{font-size:.66rem;font-weight:600;opacity:.85;white-space:nowrap}
.tabs{display:flex;gap:4px;padding:0 10px;overflow-x:auto}
.tab{border:1px solid var(--line);border-bottom:0;background:var(--chip);border-radius:10px 10px 0 0;padding:6px 12px;cursor:pointer;white-space:nowrap;font-weight:700;font-size:.9rem}
.tab.on{background:var(--panel);color:var(--accent)}
.pane{display:none;background:var(--panel);min-height:60vh;padding-bottom:60px}.pane.on{display:block}
.msg{padding:6px 10px;font-size:.88rem;font-weight:700;color:#fff;background:#1a3a5c}.msg.err{background:var(--warn)}.msg:empty{display:none}
.scene{overflow-x:auto;direction:ltr;background:#cfd6dc}
.scene svg{display:block;width:100%;height:auto}
#sc{cursor:grab;touch-action:none}
#stage{position:relative;background:#cfd6dc}
.cap{position:absolute;top:8px;right:8px;left:8px;display:flex;gap:6px;align-items:flex-start;pointer-events:none;z-index:2}
.cap span{background:rgba(10,20,32,.82);color:#fff;border-radius:10px;padding:5px 10px;font-size:.88rem;font-weight:700;line-height:1.4;max-width:80%}
.cap .gp{margin-inline-start:auto;background:rgba(26,138,66,.9)}
.camb{position:absolute;bottom:8px;left:8px;display:flex;gap:6px;z-index:3}
.camb button{border:0;border-radius:10px;background:rgba(10,20,32,.78);color:#fff;font-weight:700;padding:6px 10px;cursor:pointer;font-size:.85rem}
.tbar{display:none}
#stage.th{position:fixed;inset:0;z-index:100;background:#0d1620;display:flex;flex-direction:column}
#stage.th .scene{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage.th .scene svg{width:100%;height:100%;min-width:0}
#stage.th .tbar{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:#0d1620}
#stage.th .tbar .ob{background:#1d2a38;border-color:#33465a;color:#fff;min-width:54px;padding:4px 6px;font-size:.72rem}
#stage.th .tbar .ob i{width:30px;height:30px;line-height:24px;font-size:.85rem}
#stage.th .camb{display:none}
.rot{display:none}
@media (orientation:portrait){#stage.th .rot{display:block;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);color:#fff;padding:12px 16px;border-radius:12px;font-weight:700;z-index:4;pointer-events:none;text-align:center}}
@media (orientation:landscape) and (max-height:560px){.top .bar1 h1 .credit{display:none}.top .bar1{padding:4px 10px 2px}.bar2{padding:2px 10px 4px}.msg{padding:3px 10px}
  #p-line{display:none}#p-line.on{display:grid;grid-template-columns:minmax(0,1fr) 230px;align-items:start}#p-line.on #stage{grid-row:1/span 4}#p-line.on .ops{gap:5px;padding:6px}#p-line.on .ob{min-width:48px;padding:3px 4px;font-size:.66rem}#p-line.on .ob i{width:28px;height:28px;line-height:22px;font-size:.8rem}#p-line.on .chips,#p-line.on .goals{font-size:.8rem}#p-line.on .plcv{grid-column:1/span 2}}
.ops{display:flex;flex-wrap:wrap;gap:8px;padding:8px 10px;align-items:center}
.ob{display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid var(--line);background:var(--chip);border-radius:12px;padding:6px 8px;min-width:64px;cursor:pointer;font-size:.78rem;font-weight:700;user-select:none;-webkit-user-select:none;touch-action:none}
.ob i{display:block;width:38px;height:38px;border-radius:50%;border:3px solid rgba(0,0,0,.3);font-style:normal;color:#fff;font-weight:800;line-height:32px;text-align:center;font-size:1rem}
.ob.dn i{transform:scale(.88);box-shadow:inset 0 3px 6px rgba(0,0,0,.5)}
.ob.on{border-color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 10px}
.chips span{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.82rem}
.chips .ok{color:var(--ok);border-color:var(--ok)}.chips .bad{color:var(--warn);border-color:var(--warn)}
.goals{padding:4px 12px}.goals li{font-size:.9rem;margin:2px 0;list-style:none}.goals ul{padding:0;margin:4px 0}
.plcv{direction:ltr;padding:4px 10px;overflow-x:auto}.plcv svg{display:block;max-width:760px;width:100%;height:auto;border-radius:8px}
.plgs{display:flex;flex-wrap:wrap;gap:4px;padding:4px 0;direction:ltr;font-size:.75rem}.plg{border:1px solid var(--line);border-radius:6px;padding:1px 5px;background:var(--chip)}.plg b{color:var(--s7)}.plg.on{background:#d7f9dd;border-color:#3cbf5a}.plgsep{width:12px}
.plccap{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem;padding:4px 2px;direction:rtl}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 10px;cursor:pointer;white-space:nowrap;font-weight:700;font-size:.86rem}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.s7{background:var(--s7);color:#fff;border-color:var(--s7)}.btn.red{color:var(--warn)}
.btn:disabled{opacity:.45}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px}
.board{overflow:auto;direction:ltr;background:#d9dee3;max-height:72vh;border-block:1px solid var(--line);touch-action:pan-x pan-y}
.board svg{display:block}
.rep{padding:6px 12px;font-size:.88rem}.rep li{margin:2px 0}.rep .bad{color:var(--warn)}.rep .ok{color:var(--ok)}
.nets{padding:6px 8px}
.net{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:#fbfcfd;overflow:hidden}
.nh{display:flex;align-items:center;gap:6px;padding:4px 8px;background:#e9eef3;font-size:.85rem}
.nh b{direction:ltr;white-space:nowrap;color:var(--s7)}
.nh input{flex:1;min-width:60px;border:1px solid var(--line);border-radius:6px;padding:2px 6px;background:#fff;font-size:.84rem}
.nh button{border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;padding:0 6px;height:26px;font-size:.8rem}
.lad{overflow-x:auto;direction:ltr}.lad svg{display:block}
.ce{direction:rtl;border-top:1px solid var(--line);padding:6px 8px;background:#fff;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ce .tb{border:1px solid var(--line);background:var(--chip);border-radius:7px;padding:2px 8px;cursor:pointer;font-family:monospace;font-weight:700;direction:ltr;min-height:32px}
.ce .tb.on{background:var(--s7);color:#fff;border-color:var(--s7)}
.ce select,.ce input{border:1px solid var(--line);border-radius:7px;padding:3px 6px;background:#fff;direction:ltr;min-height:32px}
.stl{direction:ltr;font-family:Consolas,monospace;font-size:.85rem;background:#10202b;color:#cfe8ff;padding:10px 12px;margin:8px;border-radius:10px;white-space:pre;overflow-x:auto}
.doc{padding:8px 14px;font-size:.93rem}.doc h3{font-size:1rem;margin:.6em 0 .3em}
table.io{border-collapse:collapse;font-size:.86rem;width:100%;max-width:680px}
table.io td,table.io th{border:1px solid var(--line);padding:3px 8px;text-align:start}table.io th{background:var(--chip)}
table.io td.a{direction:ltr;text-align:left;font-family:monospace;font-weight:700;color:var(--s7)}
.note{background:var(--chip);border-radius:10px;padding:8px 10px;font-size:.88rem;margin:6px 0}
.wsel{stroke:#ffb300!important;stroke-width:7!important}
details.mm{position:relative;flex:none}details.mm>summary{list-style:none;cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 12px;font-weight:800}
details.mm>summary::-webkit-details-marker{display:none}
details.mm>div{position:absolute;inset-inline-end:0;top:calc(100% + 4px);z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:200px}
details.mm>div .btn,details.mm>div .ob{width:100%;text-align:start}
details.mm .ob{flex-direction:row;gap:8px;justify-content:flex-start;min-width:0;padding:4px 8px}details.mm .ob i{width:26px;height:26px;line-height:20px;font-size:.8rem}
details.fold{margin:4px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}details.fold>summary{cursor:pointer;padding:6px 10px;font-weight:700;font-size:.9rem}
.hint{color:var(--muted);font-size:.82rem;padding:0 10px 4px}
.term{cursor:pointer}.term:hover circle.tc{stroke:#ff8a00}
@media (max-width:600px){.bar1 h1{font-size:.9rem}.ob{min-width:56px;padding:5px 6px}.ob i{width:34px;height:34px;line-height:28px}}
</style>
</head>
<body>
<div class="top">
  <div class="bar1">
    <h1>خط الإنتاج · PLC Step 7<span class="credit">م. جابر الفيفي · Claude ©</span></h1>
    <button class="ib" id="bUpd" title="تحديث صفحة خط الإنتاج إلى آخر نسخة دون الخروج">⟳</button><button class="ib" id="bBack" title="رجوع إلى المحاكي">رجوع ↩</button>
  </div>
  <div class="bar2">
    <select id="exSel" aria-label="التمرين"></select>
    <div class="mdl" role="group" aria-label="جهاز PLC"><button id="m300" title="SIMATIC S7-300: الجهاز القديم الكلاسيكي، يُبرمج ببرنامج Step 7 (CPU 317-2 PN/DP مع SM321 وSM322)"><b>S7-300</b><small>CPU 317 · قديم</small></button><button id="m1200" title="SIMATIC S7-1200: الجهاز الحديث، يُبرمج ببرنامج TIA Portal (CPU 1214C)"><b>S7-1200</b><small>CPU 1214C · حديث</small></button></div>
    <details class="mm"><summary title="خيارات التمرين">⋯</summary><div><button class="btn red" id="bClear">🧹 امسح وابدأ بنفسي</button><button class="btn" id="bReady">✨ أرجعه جاهزًا</button></div></details>
  </div>
  <div class="tabs" role="tablist"><button class="tab" data-t="line">🏭 الخط</button><button class="tab" data-t="wire">🔌 التوصيل</button><button class="tab" data-t="prog">🧠 البرنامج</button><button class="tab" data-t="ex">📋 التمرين</button></div>
  <div class="msg" id="msg"></div>
</div>
<div class="pane" id="p-line">
  <div id="stage"><div class="scene"><svg id="sc" viewBox="0 0 1420 600" role="img" aria-label="خط الإنتاج"></svg></div>
    <div class="cap"><span id="capT"></span><span class="gp" id="capG"></span></div>
    <div class="camb"><button id="zIn" title="تكبير">＋</button><button id="zOut" title="تصغير">－</button><button id="zFit" title="الخط كله">⤢</button><button id="thB" title="عرض كامل الشاشة بالعرض مثل الفيديو">⛶ عرض</button></div>
    <div class="rot">🔄 أدر الجوال للوضع الأفقي</div>
    <div class="tbar" id="tbar"></div></div>
  <div class="ops" id="ops"></div>
  <div class="chips" id="chips"></div>
  <div class="plcv" id="plcv"></div>
  <details class="fold" id="gFold"><summary id="gSum">المطلوب</summary><div class="goals" id="goals"></div></details>
</div>
<div class="pane" id="p-wire">
  <div class="row"><button class="btn pri" id="wChk">✔ فحص</button><button class="btn" id="wUndo">↶</button><button class="btn red" id="wDel" disabled>🗑</button><button class="btn" id="wFull">🔧 الأغطية</button><button class="btn" id="wZo">−</button><button class="btn" id="wZi">+</button>
    <details class="mm"><summary>⋯</summary><div><button class="btn" id="wSol">✨ التوصيل الجاهز</button><button class="btn red" id="wClr">مسح كل الأسلاك</button></div></details></div>
  <div class="hint" id="wHint">اضغط طرفين لتوصيل سلك · اضغط السلك لتحديده · اضغط غطاء المجرى لفكه</div>
  <div class="board" id="board"><svg id="bd"></svg></div>
  <div class="rep" id="wRep"></div>
</div>
<div class="pane" id="p-prog">
  <div class="row"><button class="btn s7" id="pDl" title="تحميل البرنامج من المحرر إلى الجهاز">⤓ تحميل</button><button class="btn" id="pRun">RUN / STOP</button><button class="btn" id="pMon">👓 مراقبة</button><button class="btn" id="pAdd">＋ شبكة</button>
    <details class="mm"><summary>⋯</summary><div><button class="btn" id="pStl">عرض STL</button><button class="btn" id="pSol">✨ البرنامج الجاهز</button><button class="btn red" id="pClr">مسح البرنامج</button></div></details></div>
  <div class="hint" id="pHint"></div>
  <div class="nets" id="nets"></div>
  <div id="stlBox"></div>
</div>
<div class="pane" id="p-ex"><div class="doc" id="exDoc"></div></div>
<script>
(function(){
/* ===================== data: I/O, devices, exercises ===================== */
const IN=[['S1','تشغيل الخط','NO'],['S0','إيقاف الخط','NC'],['B1','قطعة تحت المكبس','PNP'],['1B1','المكبس فوق','PNP'],['1B2','المكبس تحت','PNP'],
  ['B2','قطعة معيبة عند الطرد','PNP'],['B3','صندوق تحت المزلق','PNP'],['B4','قطعة تسقط في الصندوق','PNP'],['B5','صندوق عند التعبئة','PNP'],
  ['SQ1','المصعد تحت','LS'],['SQ2','المصعد فوق','LS'],['S2','تشغيل الخلاط','NO'],['F','الأوفرلودات (NC على التوالي)','OL'],['S3','إيقاف الخلاط','NC']];
const OUT=[['K1','محرك السير M1'],['Y1','إنزال المكبس 1A'],['Y2','بوابة الطرد 2A'],['K2','سير الصناديق M2'],['Y3','صمام التعبئة'],
  ['K3','المصعد صعود M4'],['K4','المصعد نزول M4'],['KM','الخلاط: الرئيسي'],['KY','الخلاط: نجمة'],['KD','الخلاط: دلتا']];
const IA=i=>'I'+(i>>3)+'.'+(i&7),QA=i=>'Q'+(i>>3)+'.'+(i&7);
const INI={},OUTI={};IN.forEach((d,i)=>INI[d[0]]=i);OUT.forEach((d,i)=>OUTI[d[0]]=i);
/* motors: contactors, overload, kind */
const MOT={M1:{k:['K1'],f:'F1',n:'محرك السير الناقل',kind:'dol'},M2:{k:['K2'],f:'F2',n:'محرك سير الصناديق',kind:'dol'},
  M3:{k:['KM','KY','KD'],f:'F3',n:'محرك الخلاط (نجمة/دلتا)',kind:'yd'},M4:{k:['K3','K4'],f:'F4',n:'محرك المصعد (عكس حركة)',kind:'rev'}};
/* ---- the exercises ---- */
const EXS=[
 {id:'e1',n:'1. تشغيل السير الناقل مع تثبيت ذاتي',in:['S1','S0','F'],out:['K1'],mot:['M1'],plant:{belt:1},
  d:'S1 يشغّل محرك السير M1 ويبقى يعمل بعد رفع الإصبع، وS0 (مغلق NC) يوقفه، وفصل الأوفرلود F1 يوقفه أيضًا. القطع تنزل آليًا على السير وتسقط في الحاوية آخره.',
  goals:['run','stop','ol','deliver5']},
 {id:'e2',n:'2. تشغيل سيرين بالتتابع',in:['S1','S0','F'],out:['K1','K2'],mot:['M1','M2'],plant:{belt:1,boxes:1,boxFree:1},
  d:'عند S1 يعمل سير الصناديق M2 أولًا، وبعد 3 ثوانٍ يعمل السير الناقل M1، حتى لا تسقط القطع على سير متوقف. عند S0 يقف M1 فورًا ويستمر M2 ثلاث ثوانٍ ليفرغ ثم يقف. الأوفرلود يوقف الاثنين فورًا.',
  goals:['seqStart','seqStop','ol']},
 {id:'e3',n:'3. تشغيل الخلاط نجمة/دلتا',in:['S2','S3','F'],out:['KM','KY','KD'],mot:['M3'],plant:{mixer:1},
  d:'S2 يشغّل محرك الخلاط M3 نجمة (KM + KY) لتخفيف تيار البدء، وبعد 5 ثوانٍ يتحول إلى دلتا (KM + KD). لا يعمل KY وKD معًا أبدًا (قصر بين الأطوار). S3 والأوفرلود يوقفانه.',
  goals:['star','delta','mixStop','ol']},
 {id:'e4',n:'4. مكبس الختم الهوائي',in:['S1','S0','B1','1B1','1B2','F'],out:['K1','Y1'],mot:['M1'],plant:{belt:1,press:1},
  d:'السير يحمل القطع. عندما يكشف B1 قطعة تحت المكبس يقف السير، وينزل المكبس 1A (الصمام Y1) حتى 1B2، ويضغط نصف ثانية، ثم يرتفع حتى 1B1، ثم يعود السير. إذا تحرك السير والمكبس نازل تنحشر القطعة.',
  goals:['run','stamp5','nojam']},
 {id:'e5',n:'5. فحص القطع وطرد المعيبة',in:['S1','S0','B2','F'],out:['K1','Y2'],mot:['M1'],plant:{belt:1,sort:1},
  d:'الحساس اللوني B2 يكشف القطعة المعيبة (الحمراء). عندها تُفتح بوابة الطرد بالأسطوانة 2A (Y2) لمدة 0.8 ثانية فتسقط القطعة المعيبة في صندوق المرفوضات، وتمر السليمة.',
  goals:['run','reject3','nogoodrej']},
 {id:'e6',n:'6. العد والتعبئة في الصناديق',in:['S1','S0','B3','B4','B5','F'],out:['K1','K2','Y3'],mot:['M1','M2'],plant:{belt:1,boxes:1},
  d:'كل صندوق تحت المزلق (B3) يأخذ 5 قطع يعدّها B4. عند اكتمال العدد يقف السير M1 ويتحرك سير الصناديق M2 حتى يصل الصندوق إلى التعبئة (B5)، فيفتح صمام التعبئة Y3 أربع ثوانٍ. السير M1 لا يعمل إلا وصندوق فارغ تحته.',
  goals:['box2','fill2','nospill']},
 {id:'e7',n:'7. مصعد الصناديق (عكس حركة)',in:['S1','S0','SQ1','SQ2','F'],out:['K3','K4'],mot:['M4'],plant:{lift:1,liftSelf:1},
  d:'S1 يرفع المصعد بمحرك M4 (K3) حتى نهاية المشوار العلوية SQ2، فيُدفع الصندوق إلى الرف، ثم بعد ثانيتين ينزل (K4) حتى SQ1. لا يعمل K3 وK4 معًا أبدًا، وS0 يوقف الحركة.',
  goals:['lift2','nocrash']},

/* ===================== devices & terminals of the wiring board ===================== */
/* each device: id, type, terminals; the PLC is one device with DI, DQ, supply terminals */
function devList(ex){const L=[{id:'SUP',t:'sup'},{id:'PS',t:'ps'},{id:'PLC',t:'plc'}];
  ex.in.forEach(n=>{const k=IN[INI[n]][2];if(k==='OL')return;L.push({id:n,t:k==='NO'?'pbno':k==='NC'?'pbnc':k==='LS'?'ls':'pnp'});});
  ex.mot.forEach(m=>{const M=MOT[m];M.k.forEach(k=>L.push({id:k,t:'k'}));L.push({id:M.f,t:'ol'});L.push({id:m,t:'mot'});});
  ex.out.forEach(n=>{if(n[0]==='Y')L.push({id:n,t:'sol'});});return L;}
const TERM={sup:['L1','L2','L3'],ps:['L+','L+2','M','M2'],pbno:['13','14'],pbnc:['11','12'],ls:['13','14'],pnp:['BN','BK','BU'],
  k:['A1','A2','1','2','3','4','5','6'],ol:['1','2','3','4','5','6','95','96'],mot:['U1','V1','W1','W2','U2','V2'],sol:['A1','A2']};
/* only the inputs and outputs the exercise uses are shown on the PLC */
const usedI=ex=>IN.map((d,i)=>i).filter(i=>ex.in.includes(IN[i][0])),usedQ=ex=>OUT.map((d,i)=>i).filter(i=>ex.out.includes(OUT[i][0]));
function plcTerms(ex){const t=['L+','M','DIM','DOL','DOM'];usedI(ex).forEach(i=>t.push('I'+i));usedQ(ex).forEach(i=>t.push('Q'+i));return t;}
function allTerms(ex){const T=[];devList(ex).forEach(d=>{(d.t==='plc'?plcTerms(ex):TERM[d.t]).forEach(n=>T.push(d.id+'.'+n));});return T;}
const isAC=k=>{const [d,n]=k.split('.');return d==='SUP'||/^M\d$/.test(d)||(/^(K\d|KM|KY|KD|F\d)$/.test(d)&&/^[1-6]$/.test(n));};

/* the reference wiring of an exercise, as nets (each array must end up connected, and different arrays must stay apart) */
function solNets(ex){const D=devList(ex),has=id=>D.some(d=>d.id===id),N=[];const LP=['PS.L+','PLC.L+','PLC.DOL'],MM=['PS.M','PLC.M','PLC.DIM','PLC.DOM'];
  ex.in.forEach(n=>{const i=INI[n],k=IN[i][2];
    if(k==='NO'||k==='LS'){LP.push(n+'.13');N.push([n+'.14','PLC.I'+i]);}
    else if(k==='NC'){LP.push(n+'.11');N.push([n+'.12','PLC.I'+i]);}
    else if(k==='PNP'){LP.push(n+'.BN');MM.push(n+'.BU');N.push([n+'.BK','PLC.I'+i]);}
    else if(k==='OL'){const fs=ex.mot.map(m=>MOT[m].f);LP.push(fs[0]+'.95');for(let j=0;j<fs.length-1;j++)N.push([fs[j]+'.96',fs[j+1]+'.95']);N.push([fs[fs.length-1]+'.96','PLC.I'+i]);}});
  ex.out.forEach(n=>{const i=OUTI[n];N.push(['PLC.Q'+i,n+'.A1']);MM.push(n+'.A2');});
  N.push(LP,MM);
  /* power: L1 L2 L3 nets */
  const P={L1:['SUP.L1'],L2:['SUP.L2'],L3:['SUP.L3']};
  ex.mot.forEach(m=>{const M=MOT[m],f=M.f;
    if(M.kind==='dol'){const k=M.k[0];P.L1.push(k+'.1');P.L2.push(k+'.3');P.L3.push(k+'.5');N.push([k+'.2',f+'.1'],[k+'.4',f+'.3'],[k+'.6',f+'.5'],[f+'.2',m+'.U1'],[f+'.4',m+'.V1'],[f+'.6',m+'.W1'],[m+'.U2',m+'.V2',m+'.W2']);}
    else if(M.kind==='rev'){P.L1.push('K3.1','K4.5');P.L2.push('K3.3','K4.3');P.L3.push('K3.5','K4.1');N.push(['K3.2','K4.2',f+'.1'],['K3.4','K4.4',f+'.3'],['K3.6','K4.6',f+'.5'],[f+'.2',m+'.U1'],[f+'.4',m+'.V1'],[f+'.6',m+'.W1'],[m+'.U2',m+'.V2',m+'.W2']);}
    else{P.L1.push('KM.1');P.L2.push('KM.3');P.L3.push('KM.5');N.push(['KM.2',f+'.1'],['KM.4',f+'.3'],['KM.6',f+'.5'],[f+'.2',m+'.U1','KD.1'],[f+'.4',m+'.V1','KD.3'],[f+'.6',m+'.W1','KD.5'],
      [m+'.W2','KD.2','KY.5'],[m+'.U2','KD.4','KY.1'],[m+'.V2','KD.6','KY.3'],['KY.2','KY.4','KY.6']);}});
  N.push(P.L1,P.L2,P.L3);return N;}
function solWires(ex){const W=[];solNets(ex).forEach(n=>{for(let i=0;i<n.length-1;i++)W.push([n[i],n[i+1]]);});return W;}

/* ===================== union-find ===================== */
function UF(){const p=new Map();const f=k=>{let r=k;while(p.has(r)&&p.get(r)!==r)r=p.get(r);let c=k;while(c!==r&&p.has(c)){const n=p.get(c);p.set(c,r);c=n;}return r;};return{f,u:(a,b)=>{const ra=f(a),rb=f(b);if(ra!==rb)p.set(ra,rb);}};}

/* ===================== the electrical model =====================
   st: {wires:[[a,b]], press:Set(button ids pressed), sens:{B1:bool,...}, ls:{SQ1:bool}, Q:[bool] PLC outputs (image), plcOn,
        kOn:{K1:bool} contactor state (from last solve), olTrip:{F1:bool}, brk (Q0 tripped)} */
function elSolve(ex,st){const R={err:[],dcShort:false,acShort:false,mix:false,I:[],coil:{},plcPw:false,mot:{}};const D=devList(ex),typ={};D.forEach(d=>typ[d.id]=d.t);
  /* AC and DC must never meet */
  {const u=UF();st.wires.forEach(([a,b])=>u.u(a,b));const ac=new Set(),dc=new Set();allTerms(ex).forEach(k=>{(isAC(k)?ac:dc).add(u.f(k));});for(const r of ac)if(dc.has(r)){R.mix=true;break;}}
  if(R.mix){R.err.push('⚠ خطأ خطير: سلك يصل دائرة القوى 400V بدائرة التحكم 24V. افصله قبل التشغيل.');return R;}
  /* ---- DC 24V ---- */
  const u=UF();st.wires.forEach(([a,b])=>{if(!isAC(a))u.u(a,b);});
  const dcEdge=(a,b)=>u.u(a,b);
  D.forEach(d=>{const p=n=>d.id+'.'+n;
    if(d.t==='ps'){dcEdge(p('L+'),p('L+2'));dcEdge(p('M'),p('M2'));}
    if(d.t==='pbno'&&st.press.has(d.id))dcEdge(p('13'),p('14'));
    if(d.t==='pbnc'&&!st.press.has(d.id))dcEdge(p('11'),p('12'));
    if(d.t==='ls'&&st.ls[d.id])dcEdge(p('13'),p('14'));
    if(d.t==='ol'&&!st.olTrip[d.id])dcEdge(p('95'),p('96'));});
  /* PNP sensors: output = supply when powered and active (judged after supply nets are known) */
  const LPn=u.f('PS.L+'),Mn=u.f('PS.M');
  if(LPn===Mn){R.dcShort=true;R.err.push('⚠ قصر في مصدر 24V: L+ موصول بـ M. المصدر فصل حمايةً لنفسه.');return R;}
  D.forEach(d=>{if(d.t!=='pnp')return;const p=n=>d.id+'.'+n;if(st.sens[d.id]&&u.f(p('BN'))===u.f('PS.L+')&&u.f(p('BU'))===u.f('PS.M'))dcEdge(p('BN'),p('BK'));});
  R.plcPw=u.f('PLC.L+')===u.f('PS.L+')&&u.f('PLC.M')===u.f('PS.M');
  const dolOk=u.f('PLC.DOL')===u.f('PS.L+')&&u.f('PLC.DOM')===u.f('PS.M'),dimOk=u.f('PLC.DIM')===u.f('PS.M');
  /* outputs source 24V when on */
  if(R.plcPw&&dolOk)OUT.forEach((o,i)=>{if(st.Q[i]&&st.plcRun)dcEdge('PLC.Q'+i,'PLC.DOL');});
  const LP=u.f('PS.L+'),M=u.f('PS.M');
  if(LP===M){R.dcShort=true;R.err.push('⚠ قصر: مخرج من مخارج الجهاز موصول مباشرة بـ M. الجهاز فصل المخرج حمايةً له.');R.qShort=true;}
  IN.forEach((d,i)=>{R.I[i]=R.plcPw&&dimOk&&u.f('PLC.I'+i)===LP&&!R.dcShort;});
  D.forEach(d=>{if(d.t==='k'||d.t==='sol')R.coil[d.id]=!R.dcShort&&u.f(d.id+'.A1')===LP&&u.f(d.id+'.A2')===M;});
  R.dimOk=dimOk;R.dolOk=dolOk;
  /* ---- AC 400V ---- */
  const v=UF();st.wires.forEach(([a,b])=>{if(isAC(a))v.u(a,b);});
  if(!st.brk){const kOn=st.kOn||{};
    D.forEach(d=>{const p=n=>d.id+'.'+n;if(d.t==='k'&&kOn[d.id]){v.u(p('1'),p('2'));v.u(p('3'),p('4'));v.u(p('5'),p('6'));}if(d.t==='ol'){v.u(p('1'),p('2'));v.u(p('3'),p('4'));v.u(p('5'),p('6'));}});
    const ph={};['L1','L2','L3'].forEach(l=>{const r=v.f('SUP.'+l);if(ph[r]&&ph[r]!==l)R.acShort=true;ph[r]=l;});
    if(R.acShort)R.err.push('⚠ قصر بين الأطوار! القاطع الرئيسي Q0 فصل.');
    else ex.mot.forEach(m=>{const t=n=>ph[v.f(m+'.'+n)]||null,sp=n=>v.f(m+'.'+n);
      const W=[['U1','U2'],['V1','V2'],['W1','W2']].map(([a,b])=>({a:t(a),b:t(b),ra:sp(a),rb:sp(b)}));
      let mode='off',dir=0;const full=W.every(w=>w.a&&w.b&&w.a!==w.b),seq=x=>{const o={L1:0,L2:1,L3:2};return x.every(Boolean)?((o[x[1]]-o[x[0]]+3)%3===1&&(o[x[2]]-o[x[1]]+3)%3===1?1:(o[x[1]]-o[x[0]]+3)%3===2&&(o[x[2]]-o[x[1]]+3)%3===2?-1:0):0;};
      if(full){mode='delta';dir=seq([t('U1'),t('V1'),t('W1')]);}
      else{const s=W.map(w=>w.a&&!w.b?w.rb:null);if(s.every(x=>x)&&s[0]===s[1]&&s[1]===s[2]&&new Set(W.map(w=>w.a)).size===3){mode='star';dir=seq(W.map(w=>w.a));}
        else if(W.some(w=>(w.a&&w.b&&w.a!==w.b)||(w.a&&!w.b&&W.some(x=>x!==w&&x.rb===w.rb&&x.a&&x.a!==w.a))))mode='fault';}
      if((mode==='star'||mode==='delta')&&!dir)mode='fault';
      R.mot[m]={mode,dir};});}
  return R;}

/* ===================== Step 7 program =====================
   program: [{c:'comment', rows:[[cell...]], lk:[[bool per boundary]], out:[outEl|null per row]}]
   cell: null (open) | {t:'W'} wire | {t:'NO'|'NC'|'P'|'N', a} | {t:'GE', a:'C1', n} compare counter >= n
   out: {t:'=','S','R','TON','TOF','CU', a, v (seconds / PV), r (reset address for CU)} */
const NC=6,NR=4;
function newNet(){return{c:'',rows:[Array.from({length:NC},()=>({t:'W'})),...Array.from({length:NR-1},()=>Array(NC).fill(null))],lk:Array.from({length:NR-1},()=>Array(NC+1).fill(false)),out:Array(NR).fill(null)};}
function plcNew(){return{I:[],Q:Array(OUT.length).fill(false),M:{},T:{},C:{},E:{},run:false};}
function bitOf(P,a,model){if(!a)return false;const c=a[0];
  if(c==='I')return !!P.I[INI_A[a]];if(c==='Q')return !!P.Q[OUTI_A[a]];if(c==='M')return !!P.M[a];
  if(c==='T'){const t=P.T[a];return !!(t&&t.q);}if(c==='C'){const k=P.C[a];return !!k&&(model==='300'?k.cv>0:k.cv>=(k.pv||0));}return false;}
const INI_A={},OUTI_A={};IN.forEach((d,i)=>INI_A[IA(i)]=i);OUT.forEach((d,i)=>OUTI_A[QA(i)]=i);
function netFlow(P,N,model,key,mon){const R=N.rows.length,val=Array.from({length:R},()=>Array(NC+1).fill(false));
  for(let r=0;r<R;r++)val[r][0]=true;
  const join=b=>{if(b===0)return;for(let r=0;r<R-1;r++)if(N.lk[r][b]){let r2=r;while(r2<R-1&&N.lk[r2][b])r2++;const v=val.slice(r,r2+1).some(x=>x[b]);for(let q=r;q<=r2;q++)val[q][b]=v;r=r2;}};
  for(let c=0;c<NC;c++){for(let r=0;r<R;r++){const e=N.rows[r][c];let pass=false;
      if(e){const b=bitOf(P,e.a,model);
        if(e.t==='W')pass=true;else if(e.t==='NO')pass=b;else if(e.t==='NC')pass=!b;
        else if(e.t==='P'||e.t==='N'){const k=key+':'+r+':'+c,old=!!P.E[k];P.E[k]=b;pass=e.t==='P'?b&&!old:!b&&old;}
        else if(e.t==='GE'){const k=P.C[e.a];pass=!!k&&k.cv>=(+e.n||0);}}
      val[r][c+1]=val[r][c]&&pass;if(mon)mon[r][c]=val[r][c+1];}
    join(c+1);}
  return val.map(x=>x[NC]);}
function plcScan(P,prog,model,dt,mon){
  prog.forEach((N,ni)=>{const m=mon?(mon[ni]={c:N.rows.map(()=>Array(NC).fill(false)),o:[]}):null;const pw=netFlow(P,N,model,ni,m&&m.c);
    N.out.forEach((o,r)=>{if(!o)return;const p=pw[r];if(m)m.o[r]=p;const a=o.a;if(!a)return;
      const set=(a,v)=>{const c=a[0];if(c==='Q'&&OUTI_A[a]!=null)P.Q[OUTI_A[a]]=v;else if(c==='M')P.M[a]=v;};
      if(o.t==='=')set(a,p);else if(o.t==='S'){if(p)set(a,true);}else if(o.t==='R'){if(p){if(a[0]==='C'){const k=P.C[a];if(k)k.cv=0;}else if(a[0]==='T'){P.T[a]={acc:0,q:false};}else set(a,false);}}
      else if(o.t==='TON'||o.t==='TOF'){const t=P.T[a]||(P.T[a]={acc:0,q:false,in:false});const pt=+o.v||0;
        if(o.t==='TON'){if(p){t.acc=Math.min(pt,t.acc+dt);t.q=t.acc>=pt;}else{t.acc=0;t.q=false;}}
        else{if(p){t.acc=0;t.q=true;}else if(t.q){t.acc+=dt;if(t.acc>=pt)t.q=false;}}t.in=p;}
      else if(o.t==='CU'){const k=P.C[a]||(P.C[a]={cv:0,pv:0,last:false});k.pv=+o.v||0;if(p&&!k.last)k.cv=Math.min(999,k.cv+1);k.last=p;
        if(o.r&&bitOf(P,o.r,model))k.cv=0;}});});}
/* ===================== reference programs (canonical addresses, S7-1200 style) ===================== */
function cellOf(s){if(s==null)return null;if(s==='W')return{t:'W'};let m;
  if((m=/^>=(C\d+):(\d+)$/.exec(s)))return{t:'GE',a:m[1],n:+m[2]};if((m=/^([PN]):(.+)$/.exec(s)))return{t:m[1],a:m[2]};if(s[0]==='/')return{t:'NC',a:s.slice(1)};return{t:'NO',a:s};}
function outOf(s){if(!s)return null;if(s[0]==='=')return{t:'=',a:s.slice(1)};const p=s.split(':');
  if(p[0]==='S'||p[0]==='R')return{t:p[0],a:p[1]};if(p[0]==='TON'||p[0]==='TOF')return{t:p[0],a:p[1],v:+p[2]};if(p[0]==='CU')return{t:'CU',a:p[1],v:+p[2],r:p[3]||''};return null;}
function NW(c,rows,outs,links){const N=newNet();N.c=c;N.rows=Array.from({length:NR},(_,r)=>Array.from({length:NC},(_,k)=>{const s=rows[r]&&rows[r][k];if(s!==undefined)return cellOf(s);return r===0?{t:'W'}:null;}));
  N.out=Array.from({length:NR},(_,r)=>outOf(outs[r]));(links||[]).forEach(([r,b])=>{N.lk[r][b]=true;});return N;}
const LATCH=(c,set,stop,ol,mem)=>NW(c,[[set,stop,ol],[mem]],['='+mem],[[0,1]]);

const P_SORT=()=>[NW('B2 كشف قطعة معيبة: ابدأ الطرد',[['I0.5']],['S:M0.4']),NW('افتح بوابة الطرد Y2',[['M0.4']],['=Q0.2']),

  try{const p=JSON.parse(ls(keyP())||'null');if(Array.isArray(p)&&p.length)EP=p;}catch(_){}
  L.prog=clone(EP);L.plcRun=true;SEL=null;PEND=null;WSEL=null;HIST=[];MONS=[];
  $('exSel').value=EX.id;ls('ln2:ex',EX.id);renderAll();}
function saveW(){ls(keyW(),JSON.stringify(L.wires));}function saveP(){ls(keyP(),JSON.stringify(EP));}

$('bReady').onclick=()=>{if(!confirm('إرجاع «'+EX.n+'» جاهزًا بالتوصيل والبرنامج؟ سيُستبدل عملك في هذا التمرين.'))return;ls(keyW(),null);ls(keyP(),null);loadEx();showTab('line');say('رجع الخط جاهزًا: شغّله بالضواغط');};

function scene(){const p=EX.plant,PL=L.PL,E=L.EL||{},mot=m=>(E.mot&&E.mot[m])||{mode:'off'},kOn=L.kOn||{};let s='';
  const T=(x,y,t,sz,c,w,a)=>`<text x="${x}" y="${y}" text-anchor="${a||'middle'}" style="font:${w||700} ${sz||12}px sans-serif;fill:${c||'#1c2833'}">${t}</text>`;
  const led=(x,y,on,c)=>`<circle cx="${x}" cy="${y}" r="5" fill="${on?(c||'#39d353'):'#3a3f44'}" stroke="#111"/>`;
  const mlab=(x,y,m)=>{const r=mot(m),run=r.mode==='star'||r.mode==='delta';const txt=r.mode==='delta'?(m==='M3'?'دلتا':'يعمل'):r.mode==='star'?(m==='M3'?'نجمة':'يعمل'):r.mode==='fault'?'يطن!':'متوقف';
    return `<g><rect x="${x-34}" y="${y-18}" width="68" height="36" rx="6" fill="${run?'#2f7d3a':r.mode==='fault'?'#b3261e':'#5d6770'}" stroke="#222"/>${T(x,y-3,m,12,'#fff',800)}${T(x,y+12,txt+(run&&r.dir<0&&m!=='M4'?' ⟲':''),9.5,'#fff',600)}</g>`;};
  s+=`<rect width="1420" height="600" fill="#cfd6dc"/><rect y="560" width="1420" height="40" fill="#9aa4ad"/>`;

      <path d="M130 190L140 250H160L170 190Z" fill="#7a8794" stroke="#38485a" stroke-width="2"/>${T(150,30,'الخلاط',13)}${mlab(272,80,'M3')}`;}
  else if(p.belt)s+=`<path d="M120 200h70l-20 60h-30z" fill="#aab4bd" stroke="#555"/>${T(150,190,'تغذية آلية',11)}`;
  /* conveyor 1 */
  if(p.belt){const r=mot('M1'),off=((PL.t*(r.mode==='star'||r.mode==='delta'?r.dir*70:0))%24+24)%24;
    s+=`<rect x="110" y="${BY}" width="800" height="22" rx="11" fill="#2b2f33"/><line x1="122" y1="${BY+11}" x2="898" y2="${BY+11}" stroke="#5a6168" stroke-width="12" stroke-dasharray="12 12" stroke-dashoffset="${(-off).toFixed(1)}"/>
      <circle cx="122" cy="${BY+11}" r="11" fill="#777"/><circle cx="898" cy="${BY+11}" r="11" fill="#777"/><rect x="120" y="${BY+22}" width="10" height="${560-BY-22}" fill="#6b747d"/><rect x="880" y="${BY+22}" width="10" height="${560-BY-22}" fill="#6b747d"/>${mlab(150,BY+60,'M1')}`;
    if(!p.boxes)s+=`<path d="M905 ${BY+40}h90l-8 120h-74z" fill="#7d8f62" stroke="#444" stroke-width="2"/>${T(950,BY+120,'الحاوية',12,'#fff')}`;}
  /* press */
  if(p.press){const y=170+PL.press*108;s+=`<rect x="345" y="40" width="110" height="18" fill="#4a5560"/><rect x="345" y="40" width="10" height="${BY-40}" fill="#4a5560"/><rect x="445" y="40" width="10" height="${BY-40}" fill="#4a5560"/>
      <rect x="380" y="58" width="40" height="112" rx="5" fill="#c9d3dc" stroke="#45515c" stroke-width="2"/>${T(400,52,'1A',11,'#fff')}<rect x="394" y="170" width="12" height="${(y-170).toFixed(1)}" fill="#d9dee3" stroke="#666"/><rect x="378" y="${y.toFixed(1)}" width="44" height="14" rx="3" fill="#59636d"/>
      ${led(372,70,PL.press<0.03,'#ffcc00')}${T(352,74,'1B1',9,'#222',700,'end')}${led(372,160,PL.press>0.97,'#ffcc00')}${T(352,164,'1B2',9,'#222',700,'end')}${T(470,110,'Y1',11,kOn.Y1?'#0b6b20':'#555')}
      <rect x="392" y="${BY+24}" width="16" height="14" fill="#333"/>${(()=>{const b=PL.pieces.some(q=>q.st==='belt'&&Math.abs(q.x-GX.press)<=6);return `<line x1="372" y1="${BY-14}" x2="428" y2="${BY-14}" stroke="${b?'#ff2d2d':'#ff9a9a'}" stroke-width="${b?2.5:1}" stroke-dasharray="${b?'':'3 3'}"/><rect x="364" y="${BY-24}" width="8" height="20" fill="#333"/><rect x="428" y="${BY-24}" width="8" height="20" fill="#333"/>${T(400,BY+52,'B1',10)}`;})()}`;}
  /* sorting gate */
  if(p.sort){const g=PL.gate;s+=`<rect x="${GX.gate-30}" y="${BY}" width="60" height="22" fill="${g>0.5?'#0d0f11':'#2b2f33'}"/>${g>0.05?`<path d="M${GX.gate-30} ${BY+22}l${(55*g).toFixed(1)} ${(40*g).toFixed(1)}" stroke="#888" stroke-width="5"/>`:''}
      <path d="M${GX.gate-50} ${BY+56}h100l-10 74h-80z" fill="#b34a3a" stroke="#5a1f17" stroke-width="2"/>${T(GX.gate,BY+100,'المرفوضات',11,'#fff')}${T(GX.gate+70,BY+50,'2A / Y2',10,kOn.Y2?'#0b6b20':'#555')}

      ${T(GX.chute,BB+40,'B3',10)}<rect x="${GX.chute-4}" y="${BB+20}" width="8" height="8" fill="#2d6cdf"/>${T(GX.fill,BB+40,'B5',10)}<rect x="${GX.fill-4}" y="${BB+20}" width="8" height="8" fill="#2d6cdf"/>${T(905,420,'B4',10,'#222',700,'end')}
      <rect x="${GX.fill-40}" y="300" width="80" height="60" rx="8" fill="#5b8fc9" stroke="#2b4d75" stroke-width="2"/>${T(GX.fill,335,'سائل',11,'#fff')}<rect x="${GX.fill-6}" y="360" width="12" height="40" fill="#555"/>${T(GX.fill+55,390,'Y3',11,kOn.Y3?'#0b6b20':'#555')}

    const sn=plantSensors(EX,PL).S;s+=led(GX.chute,BB+56,sn.B3,'#ffcc00')+led(GX.fill,BB+56,sn.B5,'#ffcc00')+led(915,410,sn.B4,'#ffcc00');
    PL.boxes.forEach(b=>{const y=b.st==='lift'?BB-70-320*PL.lift:BB-70;if(b.x<760)return;s+=`<g><rect x="${(b.x-45).toFixed(1)}" y="${y.toFixed(1)}" width="90" height="70" fill="#c69a5b" stroke="#6d4f22" stroke-width="2"/>${b.fill>0?`<rect x="${(b.x-41).toFixed(1)}" y="${(y+66-60*Math.min(1.1,b.fill)).toFixed(1)}" width="82" height="${(60*Math.min(1.1,b.fill)).toFixed(1)}" fill="#4aa3ff" opacity=".7"/>`:''}${T(b.x.toFixed(1),y+40,b.n?b.n+' قطع':'',11,'#3b2a10')}</g>`;});}
  /* lift */
  if(p.lift){const y=BB-320*PL.lift;s+=`<rect x="1212" y="160" width="8" height="${BB-140}" fill="#556"/><rect x="1300" y="160" width="8" height="${BB-140}" fill="#556"/><rect x="1215" y="${y.toFixed(1)}" width="90" height="12" fill="#3d4650"/>${mlab(1260,130,'M4')}
      <rect x="1310" y="${BB-320}" width="105" height="10" fill="#6b4f2a"/>${T(1362,BB-330,'الرف: '+PL.cnt.stored,11)}${led(1325,BB-6,PL.lift<=0.01,'#ffcc00')}${T(1340,BB-2,'SQ1',10,'#222',700,'start')}${led(1325,BB-312,PL.lift>=0.99,'#ffcc00')}${T(1340,BB-296,'SQ2',10,'#222',700,'start')}`;
    if(!p.boxes)PL.boxes.forEach(b=>{const yy=BB-70-320*PL.lift;s+=`<rect x="${b.x-45}" y="${yy.toFixed(1)}" width="90" height="70" fill="#c69a5b" stroke="#6d4f22" stroke-width="2"/>`;});}
  /* pieces */
  PL.pieces.forEach(q=>{let x=q.x,y=BY-26,o=1;
    if(q.st==='chute'){x=900+(GX.chute-900)*q.f;y=BY-26+(BB-70-(BY-26))*q.f;}else if(q.st==='rej'){x=GX.gate;y=BY+q.f*80;o=Math.max(0,1-q.f);}else if(q.st==='bin'){x=950;y=BY+30+q.f*60;o=Math.max(0,1-q.f);}else if(q.st==='floor'){y=BB+q.f*10;o=Math.max(0,1-q.f);}
    s+=`<g opacity="${o.toFixed(2)}"><rect x="${(x-18).toFixed(1)}" y="${y.toFixed(1)}" width="36" height="26" rx="4" fill="${q.bad?'#d8322b':'#6f8fb3'}" stroke="#2a3540" stroke-width="1.5"/>${q.stamped?`<circle cx="${x.toFixed(1)}" cy="${(y+13).toFixed(1)}" r="6" fill="none" stroke="#fff" stroke-width="2"/>`:''}</g>`;});

  if(!E.plcPw&&!E.mix)c+=`<span class="bad">PLC غير مغذى: وصّل L+ وM للجهاز من المصدر 24V</span>`;else if(E.plcPw&&!E.dimOk)c+=`<span class="bad">المداخل لا تعمل: وصّل 1M بـ M</span>`;else if(E.plcPw&&!E.dolOk&&EX.out.length)c+=`<span class="bad">المخارج لا تعمل: وصّل ${MODEL==='300'?'2L+ و2M':'3L+ و3M'}</span>`;

/* ---------- the PLC as it looks in the workshop: S7-300 rack or S7-1200 compact CPU ---------- */

const PLCIMG={'300':{src:'img/s7-300.jpg',w:1142,h:594},'1200':{src:'img/s7-1200.jpg',w:1186,h:550}};
function plcSVG(){const E=L.EL||{},pw=!!E.plcPw,run=pw&&L.plcRun,I=L.P.I||[],Q=L.Q,M=PLCIMG[MODEL];
  const led=(x,y,on,c,w,h)=>on?`<rect x="${x-(w||9)/2}" y="${y-(h||7)/2}" width="${w||9}" height="${h||7}" rx="1.5" fill="${c}" stroke="#fff" stroke-width=".8"/><rect x="${x-(w||9)/2-4}" y="${y-(h||7)/2-4}" width="${(w||9)+8}" height="${(h||7)+8}" rx="5" fill="${c}" opacity=".35"/>`:'';
  const tag=(x,y,t,a)=>`<text x="${x}" y="${y}" text-anchor="${a||'middle'}" style="font:800 11px sans-serif;fill:#0b3d91;paint-order:stroke;stroke:#fff;stroke-width:3px">${t}</text>`;
  let s=`<svg viewBox="0 0 ${M.w} ${M.h}"><image href="${M.src}" x="0" y="0" width="${M.w}" height="${M.h}"/>`;
  if(MODEL==='300'){s+=led(72,128,pw,'#3cff5a',7,22);
    s+=led(506,112,pw&&false,'#ff3b30')+led(506,152,pw,'#3cff5a')+led(506,192,run,'#3cff5a')+led(506,212,pw&&!L.plcRun,'#ffcc00');
    /* mode selector RUN / STOP: tap it */
    s+=`<g data-rs="1" style="cursor:pointer"><rect x="520" y="250" width="90" height="52" fill="transparent"/><rect x="538" y="${L.plcRun?258:272}" width="16" height="12" rx="2" fill="#ffcc00" opacity=".9"/></g>`;
    usedI(EX).forEach(i=>{const by=i>>3,bit=i&7,y=(by?374:132)+bit*20.2;s+=led(664,y,I[i],'#3cff5a',8,7)+tag(733,y+4,IN[i][0]);});
    usedQ(EX).forEach(i=>{const by=i>>3,bit=i&7,y=(by?374:132)+bit*20.2;s+=led(822,y,Q[i],'#3cff5a',8,7)+tag(891,y+4,OUT[i][0]);});}
  else{s+=led(187.5,246.5,run,'#3cff5a',7,6)+led(187.5,246.5,pw&&!L.plcRun,'#ffcc00',7,6)+led(201,246.5,false,'#ff3b30',7,6);

function thOn(){const st=$('stage');st.classList.add('th');document.body.style.overflow='hidden';$('thB').textContent='✕ خروج';
  const fs=st.requestFullscreen||st.webkitRequestFullscreen;if(fs){try{const pr=fs.call(st,{navigationUI:'hide'});if(pr&&pr.then)pr.then(()=>{try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{});}catch(_){}setTimeout(zFit,200);}).catch(()=>{});}catch(_){}}
  setTimeout(zFit,60);}
function thOff(){const st=$('stage');st.classList.remove('th');document.body.style.overflow='';$('thB').textContent='⛶ عرض';try{screen.orientation&&screen.orientation.unlock&&screen.orientation.unlock();}catch(_){}
  if(document.fullscreenElement||document.webkitFullscreenElement){try{(document.exitFullscreen||document.webkitExitFullscreen).call(document);}catch(_){}}setTimeout(zFit,60);}
function camNext(){zFit();}
$('thB').onclick=()=>{$('stage').classList.contains('th')?thOff():thOn();};
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&$('stage').classList.contains('th'))thOff();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('stage').classList.contains('th'))thOff();});
addEventListener('resize',()=>camApply());
